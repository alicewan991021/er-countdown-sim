<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>急診值班｜夜班現場</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
:root{--paper:#e9e3d5;--muted:#a9b3ad;--line:#52605a;--gold:#d9bc7d;--red:#d96f65}
*{box-sizing:border-box}body{margin:0;background:#101718;color:var(--paper);font:13px/1.55 "Noto Sans TC",sans-serif}
button{font:inherit;color:inherit;background:#2d3a37;border:1px solid #59665e;border-radius:2px;padding:9px 13px;cursor:pointer}button:hover{background:#40514a;border-color:var(--gold)}button:disabled{opacity:.4}
.app{min-height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:9px;padding:10px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #3a4641;padding:0 2px 9px}
.brand{font-size:18px;font-weight:800;letter-spacing:.12em}.sub{font-size:10px;color:#8c9991;letter-spacing:.12em}.hud{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.readout{border:1px solid #45534d;background:#192222;padding:6px 10px;font:11px monospace;color:#d4d9cf}
#start{background:var(--gold);color:#222820;border-color:var(--gold);font-weight:700}
main{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 265px;gap:10px}
.stage{position:relative;min-height:590px;overflow:hidden;border:1px solid #68766c;background:#303d39;isolation:isolate}
.stage:before{content:"";position:absolute;inset:0;z-index:-2;background:linear-gradient(180deg,#596761 0%,#43534d 49%,#273532 100%)}
.stage:after{content:"";position:absolute;left:0;right:0;bottom:0;height:27%;z-index:-1;background:repeating-linear-gradient(90deg,#202b29 0 86px,#3c4943 87px 89px),linear-gradient(#263330,#263330);border-top:5px solid #63716a}
.window{position:absolute;left:5%;top:6%;width:34%;height:22%;border:8px solid #34423d;background:linear-gradient(135deg,#91a6a0,#526e6a);box-shadow:inset 0 0 0 2px #a8b7ac}
.window:before,.window:after{content:"";position:absolute;background:#34423d}.window:before{width:5px;top:0;bottom:0;left:50%}.window:after{height:5px;left:0;right:0;top:50%}
.room-sign{position:absolute;right:4%;top:7%;font-size:10px;letter-spacing:.18em;color:#d5d8cb;background:#1c2927b8;padding:7px 11px;border:1px solid #6d7a70}
.hotspot{position:absolute;cursor:pointer;outline:0}.hotspot:focus-visible{outline:2px solid var(--gold)}
.hotspot .hint{position:absolute;white-space:nowrap;left:50%;top:-27px;transform:translateX(-50%);background:#121a19;color:#e9e3d5;border:1px solid #68776c;padding:3px 7px;font-size:10px;opacity:0;pointer-events:none;transition:.12s}
.hotspot:hover .hint,.hotspot:focus .hint{opacity:1}
.bed-zone{left:7%;top:34%;width:42%;height:34%}
.bed-frame{position:absolute;left:0;right:0;top:21%;height:58%;background:#b9c4bc;border:7px solid #66766e;box-shadow:0 12px 0 #1c2926,0 19px 20px #0004;transform:skewY(-1deg)}
.bed-frame:before{content:"";position:absolute;left:3%;top:-20%;width:22%;height:130%;background:#e1e4da;border:2px solid #84958a}
.patient{position:absolute;left:13%;top:13%;width:27%;height:24%;border-radius:50%;background:#c89e7e;box-shadow:0 0 0 5px #d4b69b26}
.patient:after{content:"";position:absolute;left:72%;top:35%;width:220%;height:80%;background:#dfe3d9;border-radius:3px;box-shadow:0 4px 0 #8a9b91}
.patient:before{content:"";position:absolute;left:92%;top:18%;width:25%;height:115%;background:#b6c4bb;z-index:1;border-radius:2px}
.bed-label{position:absolute;bottom:0;left:0;background:#1c2927d9;border:1px solid #637269;padding:5px 8px;font-size:10px}
.monitor{right:8%;top:37%;width:17%;height:24%;background:#182321;border:6px solid #5d6c63;box-shadow:0 9px 0 #293532}
.monitor-screen{position:absolute;inset:9%;background:#14201d;border:1px solid #748277;overflow:hidden}
.monitor-screen:after{content:"";position:absolute;inset:15% 5%;background:linear-gradient(155deg,transparent 0 18%,#8bbba0 19% 20%,transparent 21% 32%,#8bbba0 33% 34%,transparent 35% 48%,#8bbba0 49% 50%,transparent 51%);opacity:.9}
.monitor-stand{position:absolute;left:43%;right:43%;bottom:-28%;height:28%;background:#66756c}
.nurse-desk{left:56%;bottom:10%;width:33%;height:21%;background:#705d48;border:5px solid #9a8669;box-shadow:0 12px 0 #1c2926}
.nurse-desk:before{content:"";position:absolute;left:-4%;right:-4%;top:-13%;height:18%;background:#b49b76;border:2px solid #c4ad87}
.desk-screen{position:absolute;left:14%;top:-53%;width:34%;height:52%;background:#172321;border:5px solid #67776b}
.desk-screen:after{content:"";position:absolute;inset:12%;background:linear-gradient(135deg,#456d60,#1c3830)}
.chair{position:absolute;right:7%;bottom:-19%;width:26%;height:25%;background:#34413b;border:4px solid #68776b;border-radius:4px}
.player{position:absolute;left:47%;top:58%;width:27px;height:42px;z-index:5;transition:left .12s,top .12s;pointer-events:none}
.player:before{content:"";position:absolute;left:5px;top:0;width:18px;height:18px;border-radius:50%;background:#d6b092;border:2px solid #f0d7b9}
.player:after{content:"";position:absolute;left:2px;top:19px;width:24px;height:23px;background:#d5d8cc;border:2px solid #829188;border-radius:3px}
.player-label{position:absolute;top:-17px;left:-9px;white-space:nowrap;font-size:9px;color:#f2e9d4;background:#172321;padding:1px 5px}
.phone-zone{right:3%;top:18%;width:15%;height:13%}.phone{position:absolute;inset:0;background:#283632;border:3px solid #718076;box-shadow:0 5px 0 #1c2926}.phone:after{content:"☎";position:absolute;inset:0;display:grid;place-items:center;font-size:26px;color:#d6bd82}
.door-zone{left:0;bottom:9%;width:12%;height:39%}.door{position:absolute;inset:0 0 0 10%;background:#5e5140;border:5px solid #8e7b60;box-shadow:inset 0 0 0 2px #3b3730}.door:after{content:"";position:absolute;right:12%;top:50%;width:5px;height:5px;border-radius:50%;background:#d8c18d}
.side{background:#172120;border:1px solid #46534d;padding:11px;display:flex;flex-direction:column;min-height:0}
.side-title{font-size:10px;letter-spacing:.16em;color:#b6c0b6;border-bottom:1px solid #3c4943;padding-bottom:8px;margin:0 0 8px}
.case-title{font-size:15px;font-weight:700;margin:0 0 3px}.case-copy{font-size:11px;color:#aeb8ae;line-height:1.7;margin:0 0 9px}
.case-metrics{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}.metric{font:10px monospace;padding:4px 6px;background:#101918;border:1px solid #425049}
.side-actions{display:grid;gap:6px}.side-actions button{text-align:left;font-size:11px;padding:8px}.side-actions button.active{border-color:var(--gold);color:#f3dfad}
.loglist{display:grid;gap:5px;overflow:auto;min-height:0}.log{padding:6px 8px;background:#202d29;border-left:2px solid #a18f62;font-size:10px;color:#b8c1b7}.log time{display:block;font:9px monospace;color:#7f8c82;margin-bottom:2px}
.bottom{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid #34413c;padding-top:8px}.key-help{font-size:10px;color:#8d9990}.key{display:inline-block;border:1px solid #56645b;background:#1b2622;padding:2px 6px;margin:0 3px;color:#d8d8ca;font:10px monospace}
#overlay{position:fixed;inset:0;background:#060a09b8;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}
#overlay.show{display:flex}.dialog{width:min(540px,100%);background:#1a2622;border:1px solid #7d8978;box-shadow:0 25px 90px #000b;padding:20px}.dialog .eyebrow{font:10px monospace;letter-spacing:.16em;color:var(--gold)}.dialog h2{font-size:21px;margin:7px 0}.dialog p{color:#c0c8bd;line-height:1.8}.dialog-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:15px}.dialog-actions button{flex:1;min-width:140px}
.toast{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);z-index:8;background:#111a18ee;border:1px solid #9a9879;padding:8px 14px;max-width:90%;font-size:12px;text-align:center;display:none}.toast.show{display:block}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr) 230px}.stage{min-height:500px}.room-sign{right:2%}.monitor{right:5%}}
@media(max-width:680px){.app{padding:8px}.top{align-items:flex-start}.brand{font-size:15px}.hud{justify-content:flex-end}.readout{font-size:10px;padding:5px 7px}main{grid-template-columns:1fr}.stage{min-height:65vh}.side{max-height:360px}.room-sign{font-size:8px}.bed-zone{left:4%;width:50%}.monitor{right:4%;width:19%}.nurse-desk{left:51%;width:40%}.player{transform:scale(.85);transform-origin:top left}}

/* Illustrated ward scene replaces the previous primitive CSS props */
.stage{min-height:620px;background:#26342f}
.ward-art{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage:before,.stage:after{display:none}
.window,.bed-frame,.patient,.monitor-screen,.monitor-stand,.desk-screen,.chair,.phone,.door{display:none!important}
.room-sign{right:3%;top:3%;z-index:2;background:#25342ee8;color:#e6e4d8;border-color:#9ca89b}
.hotspot{z-index:4;background:transparent;border:1px solid transparent}
.hotspot:hover,.hotspot:focus{background:#e5d4a00d;border:1px solid #e4d4a077}
.bed-zone{left:12%;top:34%;width:56%;height:28%}
.monitor{right:9%;top:15%;width:29%;height:24%}
.nurse-desk{right:2%;bottom:15%;width:30%;height:35%}
.phone-zone{right:2%;top:4%;width:16%;height:16%}
.door-zone{left:0;bottom:3%;width:13%;height:29%}
.player{width:24px;height:49px;z-index:5;filter:drop-shadow(0 3px 3px #1118)}
.player:before{left:4px;width:17px;height:17px;background:#d4a987;border:2px solid #f4e0ca}
.player:after{left:1px;top:18px;width:23px;height:29px;background:#6f8c87;border:2px solid #c9d4ca;border-radius:6px 6px 2px 2px}
.player-label{top:-16px;left:-7px;background:#26342e;color:#fff0d2;border:1px solid #7d8d81}
@media(max-width:680px){.stage{min-height:62vh}.bed-zone{left:10%;top:34%;width:58%;height:30%}.monitor{right:5%;top:15%;width:32%;height:24%}.nurse-desk{right:1%;bottom:15%;width:33%;height:35%}}
</style></head><body>
<div class="app">
<header><div><div class="sub">EMERGENCY DEPARTMENT · NIGHT SHIFT</div><div class="brand">急診值班</div></div><div class="hud"><span class="readout" id="clock">週一 08:00</span><span class="readout" id="shift">早班</span><span class="readout" id="duty">交班中</span><button id="start">開始值班</button><button id="pause" hidden>暫停</button><button id="speed">×1</button></div></header>

<rect x="455" y="100" width="260" height="44" rx="2" fill="#f4f1e7"/><rect x="455" y="100" width="260" height="44" fill="#63766e" opacity=".13"/><text x="470" y="128" fill="#53645c" font-size="18" font-family="sans-serif" letter-spacing="3">急診觀察區</text>

<rect x="820" y="120" width="265" height="150" rx="6" fill="#d9ded4" stroke="#87968b" stroke-width="5"/><rect x="840" y="140" width="225" height="110" fill="#263a35"/><path d="M855 215L885 215L915 170L945 225L980 185L1010 185L1048 155" fill="none" stroke="#8ed0a7" stroke-width="4"/><text x="850" y="160" fill="#b9c9bf" font-size="12">ECG · SpO₂</text>

<!-- curtain -->

<path d="M165 285L730 285L790 341L225 341Z" fill="#e8e9df" stroke="#9aa89e" stroke-width="4"/><path d="M225 341L790 341L790 372L225 372Z" fill="#a4b2a8"/>

<div class="room-sign">急診觀察區 · ER-01</div>
<div class="hotspot bed-zone" data-place="bed" tabindex="0" role="button" aria-label="處置床"><span class="hint">E｜查看病人</span></div>
<div class="hotspot monitor" data-place="monitor" tabindex="0" role="button" aria-label="生命徵象監視器"><span class="hint">E｜查看監視器</span></div>
<div class="hotspot nurse-desk" data-place="desk" tabindex="0" role="button" aria-label="護理站"><span class="hint">E｜護理站工作單</span></div>
<div class="hotspot phone-zone" data-place="phone" tabindex="0" role="button" aria-label="電話"><span class="hint">E｜接電話</span></div>
<div class="hotspot door-zone" data-place="door" tabindex="0" role="button" aria-label="出口"><span class="hint">E｜離開床邊</span></div>
<div class="player" id="player"><span class="player-label">你</span></div><div class="toast" id="toast"></div>
</section>
<aside class="side"><h2 class="side-title" id="sideTitle">當前病人</h2><div id="case"><p class="case-copy">先完成交班，開始值班後會自動派診。</p></div><h2 class="side-title" style="margin-top:12px">護理師／電話紀錄</h2><div class="loglist" id="logs"></div><div style="margin-top:10px;display:flex;gap:6px"><button id="handoff" style="flex:1">交班</button><button id="leave" style="flex:1">請假</button></div></aside></main>
<footer class="bottom"><div class="key-help"><span class="key">WASD</span>/<span class="key">↑↓←→</span>移動　<span class="key">E</span>互動　<span class="key">Esc</span>離開對話　<span class="key">M</span>全景　<span class="key">P</span>暫停</div><div class="key-help" id="hintline">走到病床、電話或護理站附近，按 E 互動</div></footer>
</div>
<div id="overlay"><div class="dialog"><div class="eyebrow" id="dialogTag">WARD CALL</div><h2 id="dialogTitle">護理師來電</h2><p id="dialogText"></p><div class="dialog-actions" id="dialogActions"></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id);const labels={bed:'處置床',monitor:'監視器',desk:'護理站',phone:'電話',door:'出口'};const days=['週一','週二','週三','週四','週五','週六','週日'];let g={started:false,run:false,paused:false,min:480,day:1,week:1,shift:0,speed:1,player:{x:47,y:58},patient:null,queue:[],events:[],logs:[],step:0,tick:0,done:0,focus:'bed',overlay:false,leave:false};
const cases=[{name:'陳先生',age:58,complaint:'胸悶、呼吸急促',triage:'緊急',v:['HR 116','BP 146/92','SpO₂ 92%'],tasks:['床邊評估','查看檢查回報','確認照護計畫','完成病歷與交班'],notes:['病人主訴胸悶、呼吸急促，護理師等候你到床邊。','心電圖回報已送達，護理師提醒你查看。','護理師通報病人冒冷汗，請重新確認狀況。','整理病歷與後續安排，交由接班團隊。']},{name:'林小姐',age:34,complaint:'腹痛、噁心',triage:'一般',v:['HR 94','BP 128/82','SpO₂ 98%'],tasks:['問診與初評','查看抽血結果','重新評估疼痛','完成病歷與交班'],notes:['病人腹痛、噁心，護理師詢問是否安排檢查。','抽血結果已回報。','病人表示疼痛位置改變。','確認後續安排並完成交班。']},{name:'王先生',age:67,complaint:'發燒、咳嗽',triage:'優先',v:['HR 108','BP 132/84','SpO₂ 94%'],tasks:['評估呼吸狀況','查看檢查回報','更新照護計畫','完成病歷與交班'],notes:['病人畏寒、咳嗽，血氧偏低。','胸部影像與抽血結果已回報。','病人仍感到喘，護理師請你重新評估。','確認後續觀察與去向。']}];
function time(){return days[(g.day-1)%7]+' '+String(Math.floor(g.min/60)%24).padStart(2,'0')+':'+String(g.min%60).padStart(2,'0')}
function log(m){g.logs.unshift({t:time(),m});g.logs=g.logs.slice(0,12);drawLogs()}
function say(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function openDialog(tag,title,text,choices){g.overlay=true;$('dialogTag').textContent=tag;$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogActions').innerHTML='';choices.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{g.overlay=false;$('overlay').classList.remove('show');fn();render()};$('dialogActions').appendChild(b)});$('overlay').classList.add('show')}
function spawn(){let c=cases[(g.done+g.queue.length+g.tick)%cases.length];g.queue.push({...c,id:g.done+g.queue.length+1,step:0,wait:0});g.queue.sort((a,b)=>({緊急:0,優先:1,一般:2}[a.triage]-({緊急:0,優先:1,一般:2}[b.triage])));log('新病人到院：'+c.name+'，已由系統分流。');if(!g.patient)assign();else call('護理師通報',c.name+'已到候診區，請留意分流。')}
function assign(){if(!g.patient&&g.queue.length&&!g.leave){g.patient=g.queue.shift();g.patient.wait=0;g.step=0;log('系統派診：'+g.patient.name+'安排至處置床。');say('系統派診：'+g.patient.name+'已安排至處置床。')}}
function call(title,text){g.events.push({title,text});log(title+'：'+text);openDialog('來電／護理師',title,text,[['我馬上過去',()=>{g.focus='bed';moveTo('bed');say('你已回應通報。');}],['先處理手邊工作',()=>{if(g.patient)g.patient.wait+=12;log('你延後回應通報。')} ]])}
function currentTask(){return g.patient?g.patient.tasks[Math.min(g.step,3)]:'目前沒有當前病人'}
function interact(place){if(!g.started){say('先按「開始值班」完成交班。');return}if(g.overlay)return;g.focus=place;if(place==='bed'){if(!g.patient){say('床邊目前沒有病人。');return}const p=g.patient;const actions=[['完成床邊評估',()=>work('assess')],['查看病人目前狀況',()=>work('recheck')],['稍後再處理',()=>{p.wait+=8;log('你暫時離開床邊。')}]];openDialog('床邊 · ER-01',p.name+'｜'+p.complaint+'。'+p.notes[Math.min(g.step,3)],actions)}
else if(place==='monitor'){openDialog('生命徵象監視器','目前監測：'+(g.patient?g.patient.v.join(' · '):'目前無床邊病人'),[['確認監測',()=>{log('你確認了監視器讀數。');say('監測資料已確認。')}],['返回',()=>{}]])}
else if(place==='desk'){openDialog('護理站 · 工作單',g.patient?'目前待辦：'+currentTask()+'。病歷進度 '+g.step+'/4。':'目前無當前病人。候診 '+g.queue.length+' 人。',g.patient?[['查看檢查回報',()=>work('result')],['更新照護計畫',()=>work('plan')],['整理病歷並交班',()=>work('handoff')]]:[['查看候診清單',()=>say('候診：'+g.queue.map(p=>p.name+'（'+p.triage+'）').join('、'))]])}
else if(place==='phone'){if(g.events.length){let e=g.events[0];openDialog('電話來電',e.title+'：'+e.text,[['立即回應',()=>{g.events.shift();if(g.patient)g.patient.wait=Math.max(0,g.patient.wait-5);log('你接起電話並回應。')}],['稍後回電',()=>{if(g.patient)g.patient.wait+=10;log('你將電話延後回應。')}]]);}else say('電話暫時沒有響。')}
else if(place==='door'){openDialog('離開床邊','要先離開處置床區嗎？未完成的病人工作會保留。',[['離開床邊',()=>{g.focus='door';say('你離開床邊，仍可回到現場。')}],['留在現場',()=>{}]])}}
function work(kind){let p=g.patient;if(!p){say('目前沒有病人。');return}if(kind==='assess'||kind==='recheck'){if(g.step===0){g.step=1;log('完成床邊評估：'+p.name+'。');say('初步評估完成。下一步查看檢查回報。')}else{p.wait=Math.max(0,p.wait-3);log('重新確認'+p.name+'的狀況。');say('已重新確認病人狀況。')}}
if(kind==='result'){if(g.step<1){say('先完成床邊評估。');return}g.step=2;log('查看檢查回報：'+p.name+'。');say('檢查回報已確認。')}
if(kind==='plan'){if(g.step<2){say('先完成評估並查看檢查回報。');return}g.step=3;log('更新照護計畫並通知護理師。');say('照護計畫已更新。')}
if(kind==='handoff'){if(g.step<3){say('尚有工作未完成：'+currentTask());return}log('完成病歷與交班：'+p.name+'由接班團隊接手。');g.patient=null;g.done++;g.step=0;assign();say('交班完成。')}
render()}
function moveTo(place){let coords={bed:[29,52],monitor:[76,52],desk:[70,75],phone:[90,31],door:[7,75]};let c=coords[place];g.player.x=c[0];g.player.y=c[1];$('player').style.left=c[0]+'%';$('player').style.top=c[1]+'%';g.focus=place;render()}
function move(dx,dy){if(!g.started||g.overlay)return;g.player.x=Math.max(3,Math.min(94,g.player.x+dx));g.player.y=Math.max(28,Math.min(84,g.player.y+dy));$('player').style.left=g.player.x+'%';$('player').style.top=g.player.y+'%'}
function nearest(){let coords={bed:[29,52],monitor:[76,52],desk:[70,75],phone:[90,31],door:[7,75]},best=null,dist=999;for(let [k,c] of Object.entries(coords)){let d=Math.hypot(g.player.x-c[0],g.player.y-c[1]);if(d<dist){best=k;dist=d}}return dist<20?best:null}
function render(){ $('clock').textContent='第 '+g.week+' 週｜'+time();$('shift').textContent=['早班','晚班','夜班'][g.shift];$('duty').textContent=!g.started?'交班中':g.leave?'請假中':g.run?'值班中':'時間暫停';$('start').hidden=g.started;$('pause').hidden=!g.started;$('pause').textContent=g.run?'暫停':'繼續';$('speed').textContent='×'+g.speed;$('bedlabel').textContent=g.patient?'處置床 ER-01 · '+g.patient.triage:'處置床 ER-01 · 空床';$('sideTitle').textContent=g.patient?'當前病人':'候診區';$('case').innerHTML=g.patient?'<h3 class="case-title">'+g.patient.name+'｜'+g.patient.age+'歲</h3><p class="case-copy">'+g.patient.complaint+' · 分流 '+g.patient.triage+'</p><div class="case-metrics">'+g.patient.v.map(v=>'<span class="metric">'+v+'</span>').join('')+'</div><p class="case-copy">目前工作：'+currentTask()+'</p><div class="case-copy">流程 '+g.step+'/4 · 等待 '+g.patient.wait+' 分鐘</div>':'<p class="case-copy">目前無當前病人。候診 '+g.queue.length+' 人；系統會依分流自動派診。</p>';$('logs').innerHTML=g.logs.map(x=>'<div class="log"><time>'+x.t+'</time>'+x.m+'</div>').join('')||'<div class="case-copy">尚無紀錄。</div>';let n=nearest();$('hintline').textContent=n?'按 E 互動：'+labels[n]+'　·　你也可以直接點選場景物件':'走到病床、電話或護理站附近，按 E 互動';document.querySelectorAll('[data-place]').forEach(el=>el.style.filter=el.dataset.place===g.focus?'drop-shadow(0 0 5px #e3c985)':'none')}
function drawLogs(){render()}
document.querySelectorAll('[data-place]').forEach(el=>{el.addEventListener('click',()=>{moveTo(el.dataset.place);interact(el.dataset.place)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();moveTo(el.dataset.place);interact(el.dataset.place)}})});
$('start').onclick=()=>{g.started=true;g.run=true;log('完成交班，開始值班。');spawn();render()};$('pause').onclick=()=>{g.run=!g.run;render()};$('speed').onclick=()=>{g.speed=g.speed===1?3:g.speed===3?6:1;render()};$('handoff').onclick=()=>openDialog('交班','確認結束當前班次？未完成病人會交由接班團隊接手。',[['完成交班',()=>{g.patient=null;g.run=false;g.started=false;g.done=0;log('班次交接完成。');say('已完成交班。')}],['繼續值班',()=>{}]]);$('leave').onclick=()=>{g.leave=!g.leave;if(g.leave&&g.patient){g.queue.unshift(g.patient);g.patient=null;log('你請假離開，病人由其他醫師接手。')}else log(g.leave?'你暫時離開值班。':'你返回值班現場。');render()};
document.addEventListener('keydown',e=>{if(g.overlay){if(e.key==='Escape'){$('overlay').classList.remove('show');g.overlay=false}return}if(e.key==='Escape'){say('你離開了互動。');return}if(e.key.toLowerCase()==='m'){$('stage').classList.toggle('wide');return}if(e.key.toLowerCase()==='p'){if(g.started){g.run=!g.run;render()}return}let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')move(0,-3);else if(k==='s'||e.key==='ArrowDown')move(0,3);else if(k==='a'||e.key==='ArrowLeft')move(-3,0);else if(k==='d'||e.key==='ArrowRight')move(3,0);else if(k==='e'){let n=nearest();if(n)interact(n);else say('靠近床邊、監視器、護理站或電話再按 E。')}});
function tick(){if(!g.run||!g.started)return;g.min+=g.speed;g.tick++;if(g.patient)g.patient.wait+=g.speed;if(g.min>=1440){g.min-=1440;g.day++;if((g.day-1)%7===0){g.week++;g.shift=(g.shift+1)%3;log('新的一週，輪班更新為'+['早班','晚班','夜班'][g.shift]+'。')}}if(g.tick%10===0)spawn();if(g.patient&&g.tick%7===0)call('護理師再次來電',g.patient.name+'仍有不適，請你回到床邊確認。');render()}
setInterval(tick,1800);render();
})();
</script></body></html>
