<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>急診值班｜現場模式</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#1b2933;--panel2:#243843;--line:#405762;--text:#edf4f6;--muted:#a9bac2;--mint:#a3e1d1;--amber:#f0cb80;--red:#ef9999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans TC",sans-serif}button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--mint)}button:disabled{opacity:.35;cursor:not-allowed}.wrap{max-width:1220px;margin:auto;padding:12px}.top,.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.brand{font-size:25px;font-weight:850}.muted,.sub{color:var(--muted);font-size:12px}.chip{border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr);gap:11px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:13px;min-width:0}.scene{background:#16232b;border:1px solid #344b56;border-radius:12px;overflow:hidden}.sceneHead{background:#223640;padding:10px 12px;display:flex;justify-content:space-between;gap:8px}.room{min-height:215px;padding:16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;background:linear-gradient(180deg,#1b303a,#14232b)}.zone{border:1px solid #3a525d;border-radius:10px;padding:12px;background:#1b2b34}.bed{display:flex;align-items:center;gap:12px;min-height:95px}.avatar{width:54px;height:54px;border-radius:50%;background:#d1b29b;position:relative;flex-shrink:0}.avatar:after{content:"";position:absolute;left:-6px;right:-6px;bottom:-23px;height:36px;border-radius:12px;background:#d7e1e3}.bedframe{height:52px;background:#6b8790;border-radius:10px;position:relative;flex:1}.bedframe:before{content:"";position:absolute;inset:7px 10px;background:#dce5e5;border-radius:8px}.label{font-size:11px;color:var(--muted);letter-spacing:.06em}.room h3{margin:5px 0;font-size:16px}.vitals{display:flex;gap:6px;flex-wrap:wrap}.vital{background:#132129;border:1px solid #354a54;border-radius:7px;padding:5px 7px;font-size:12px}.desk{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.desk button{text-align:left;min-height:45px}.desk button.selected{border-color:var(--mint);background:#28483f}.sectionTitle{font-size:15px;font-weight:750;margin:0 0 9px}.task{background:#14222b;border:1px solid var(--line);border-radius:10px;padding:10px;margin:7px 0}.task.hot{border-color:#9a5555}.task .row{margin-bottom:5px}.badge{font-size:10px;border-radius:99px;padding:3px 7px;background:#4d3d27;color:#ffe2a8}.badge.red{background:#512d32;color:#ffc6c6}.feed{display:grid;gap:6px;max-height:245px;overflow:auto}.entry{border-left:3px solid #648b93;background:#14222b;padding:8px 9px;font-size:12px;border-radius:0 7px 7px 0}.entry time{display:block;color:var(--muted);font-size:10px}.notice{padding:10px;background:#14222b;border-radius:9px;min-height:44px;margin-top:8px}.primary{background:var(--mint);color:#14332f;font-weight:800;border-color:var(--mint)}.controls{display:flex;gap:7px;flex-wrap:wrap}.controls button{flex:1}.bar{height:6px;background:#344650;border-radius:9px;overflow:hidden}.bar span{display:block;height:100%;background:var(--mint)}.queueItem{font-size:12px;background:#14222b;border-radius:8px;padding:8px;margin:6px 0}.foot{font-size:11px;color:var(--muted);margin:10px 2px}@media(max-width:760px){.layout{grid-template-columns:1fr}.room{grid-template-columns:1fr}.wrap{padding:8px}.panel{padding:10px}.brand{font-size:22px}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="sub">急診現場｜輪班制・持續運作</div><div class="brand">急診值班</div></div><div class="controls"><span class="chip" id="clock">週一 08:00</span><span class="chip" id="shift">早班</span><button id="pause">開始時間</button><button id="speed">速度 ×1</button></div></header>
<div class="layout"><section class="panel">
<div class="row"><h2 class="sectionTitle">急診處置區</h2><span class="chip" id="duty">交班中</span></div>
<div class="scene"><div class="sceneHead"><b id="sceneName">交班護理站</b><span class="muted" id="roomTag">等待交班</span></div><div class="room"><div class="zone"><div class="label">床位／病人</div><div class="bed"><div class="avatar"></div><div class="bedframe"></div></div><h3 id="patientName">尚未派診</h3><div class="muted" id="patientInfo">開始值班後，系統依分流派診。</div><div class="vitals" id="vitals"></div></div><div class="zone"><div class="label">目前工作焦點</div><h3 id="focusTitle">交班摘要</h3><div id="focusText" class="muted">急診持續收治。護理師通報、檢查結果與病人變化會陸續出現。</div><div class="bar" style="margin-top:12px"><span id="caseBar" style="width:0%"></span></div><div class="muted" id="caseProgress">尚未開始</div></div></div></div>
<div class="row" style="margin-top:12px"><h3 class="sectionTitle">處置／回應</h3><span class="muted" id="timePressure">時間尚未開始</span></div><div class="desk" id="actions"></div><div class="notice" id="feedback" aria-live="polite">先開始值班，接收第一則通報。</div><div class="controls" style="margin-top:9px"><button class="primary" id="start">完成交班，開始值班</button><button id="handoff" disabled>處理完成／交班</button></div>
<h3 class="sectionTitle" style="margin-top:15px">待回應事件</h3><div id="events"></div>
</section><aside class="panel"><div class="row"><h2 class="sectionTitle">護理站</h2><span class="chip" id="census">候診 0</span></div><div class="row"><span class="muted">候診／留觀概況</span><span class="muted" id="shiftScore">本班 0 件</span></div><div id="queue"></div><h3 class="sectionTitle" style="margin-top:14px">護理師與同事通報</h3><div class="feed" id="feed"></div><h3 class="sectionTitle" style="margin-top:14px">班表</h3><div class="controls"><button id="swap">申請換班</button><button id="leave">請假／復班</button></div><p class="muted" id="roster">本週早班；下週晚班，之後夜班。非當班由其他醫師接手。</p><p class="muted">遊戲內容為虛構情境，不是醫療訓練或臨床指引。</p></aside></div><p class="foot">此版重點是值班現場與多事件流程；完整病例、長期排班和進階系統仍待擴充。</p></main>
<script>
(()=>{const $=id=>document.getElementById(id),days=['週一','週二','週三','週四','週五','週六','週日'],shifts=['早班','晚班','夜班'];let s={day:1,week:1,min:480,run:false,paused:true,speed:1,started:false,shift:0,leave:false,patient:null,queue:[],events:[],serial:0,done:0,log:[],tick:0,activeEvent:null,caseStep:0};
const cases=[
{complaint:'胸悶、呼吸急促',age:58,triage:'緊急',v:['HR 116','BP 146/92','SpO₂ 92%'],stages:[{title:'床邊初評',text:'病人說胸口越來越悶，呼吸急促。護理師正等候你的處置。',acts:['立即床邊評估','請護理師先觀察']},{title:'檢查結果',text:'心電圖已完成，護理師通知結果已回報。',acts:['立即查看心電圖','先處理候診通報']},{title:'病情變化',text:'護理師急呼：病人突然冒冷汗，狀況看起來變差。',acts:['立即重新評估並升級處置','先完成病歷再看']}]},
{complaint:'發燒、咳嗽',age:67,triage:'優先',v:['HR 108','BP 132/84','SpO₂ 94%'],stages:[{title:'初步評估',text:'病人畏寒、咳嗽，護理師回報血氧偏低。',acts:['評估呼吸與生命徵象','請病人繼續等候']},{title:'檢查結果',text:'胸部影像與抽血結果已回報。',acts:['查看結果並更新處置','延後查看結果']},{title:'家屬詢問',text:'家屬焦急詢問檢查結果，病人仍感到喘。',acts:['重新評估並向家屬說明','只請家屬再等等']}]},
{complaint:'腹痛、噁心',age:34,triage:'一般',v:['HR 94','BP 128/82','SpO₂ 98%'],stages:[{title:'問診與評估',text:'病人腹痛、噁心，護理師詢問是否安排檢查。',acts:['問診並檢查腹部','先開離院單']},{title:'檢查結果',text:'抽血結果已回報，病人仍有腹痛。',acts:['查看結果並重新評估','忽略回報']},{title:'追蹤',text:'病人表示疼痛位置改變，護理師請你再看一次。',acts:['重新評估並安排後續','直接結束處理']}]},
{complaint:'手腕受傷、腫痛',age:22,triage:'一般',v:['HR 88','BP 122/76','SpO₂ 99%'],stages:[{title:'受傷評估',text:'病人跌倒後手腕腫痛，活動受限。',acts:['評估受傷機轉與肢體','直接安排離院']},{title:'影像結果',text:'影像檢查完成，結果已回報。',acts:['查看影像並重新評估','先忽略影像結果']},{title:'後續安排',text:'病人詢問是否能回家，護理師等待你的去向安排。',acts:['確認狀況並交代後續','不說明直接結束']}]}
];
function time(){return days[(s.day-1)%7]+' '+String(Math.floor(s.min/60)%24).padStart(2,'0')+':'+String(s.min%60).padStart(2,'0')}
function log(m){s.log.unshift({t:time(),m});s.log=s.log.slice(0,30);renderLog()}
function newEvent(kind,title,body,opts){s.events.push({id:++s.tick,kind,title,body,opts,age:0,priority:kind==='急呼'?0:1});s.events.sort((a,b)=>a.priority-b.priority);log(title+'：'+body)}
function newPatient(){s.serial++;let c=cases[(s.serial-1)%cases.length];s.queue.push({...c,id:s.serial,name:['林小姐','陳先生','王先生','張先生'][(s.serial-1)%4],step:0,wait:0,done:false});s.queue.sort((a,b)=>({緊急:0,優先:1,一般:2}[a.triage]-({緊急:0,優先:1,一般:2}[b.triage])));newEvent('派診','新病人到院',s.queue.at(-1).name+'，'+c.complaint+'。系統已分流。',['接收系統派診','稍後接診'])}
function assign(){if(!s.started||s.leave||s.patient||!s.queue.length)return;let p=s.queue.shift();s.patient=p;s.caseStep=0;s.activeEvent=null;newEvent('派診','系統自動派診',p.name+'（'+p.triage+'）已到處置區。',['查看病人','請護理師補充資料']);}
function respondEvent(id,i){let e=s.events.find(x=>x.id===id);if(!e)return;s.events=s.events.filter(x=>x.id!==id);if(e.kind==='派診'&&e.title==='新病人到院'){if(i===0)assign();else{if(s.queue.length)s.queue[0].wait+=12;log('延後接診，候診時間增加。')}}else if(e.kind==='護理師'||e.kind==='急呼'){if(i===0){if(s.patient){s.patient.wait=Math.max(0,s.patient.wait-4);log('已回應通報並查看病人。')}else log('已回覆護理師，請其持續觀察並回報變化。')}else{if(s.patient)s.patient.wait+=15;log('延後回應，病人等待時間增加。')}}else if(e.kind==='檢查'){log(i===0?'已查看檢查結果。':'延後查看檢查結果。');if(s.patient&&i===0)s.patient.step=Math.min(2,s.patient.step+1)}render()}
function act(i){let p=s.patient;if(!p)return;let st=p.stages[p.step];if(!st)return;let good=i===0;log('處置：'+st.acts[i]+(good?'（妥善回應）':'（延後／不完整）'));p.wait+=good?0:18;s.min+=good?5:13;p.step++;s.caseStep=p.step;s.activeEvent=null;if(p.step>=3){$('handoff').disabled=false;$('feedback').textContent='主要處置階段已完成。整理病歷並安排去向後交班。'}else{$('feedback').textContent=good?'已完成處置，下一則通報稍後到達。':'延後處理使等待時間增加；後續通報仍會繼續出現。'}render()}
function finish(){if(!s.patient)return;log('已完成病歷與交班：'+s.patient.name+'，交由後續照護團隊。');s.patient=null;s.done++;$('handoff').disabled=true;$('feedback').textContent='完成交班。急診仍在運作，系統會接續派診。';assign();render()}
function render(){ $('clock').textContent='第 '+s.week+' 週｜'+time();$('shift').textContent=shifts[s.shift];$('duty').textContent=!s.started?'交班中':s.leave?'請假中':s.run?'值班進行中':'已暫停';$('census').textContent='候診 '+s.queue.length;$('shiftScore').textContent='本班 '+s.done+' 件';$('roster').textContent='本週'+shifts[s.shift]+'；下週'+shifts[(s.shift+1)%3]+'，之後夜班。非當班急診由其他醫師接手。';$('start').disabled=s.started;$('start').textContent=s.started?'已完成交班':'完成交班，開始值班';$('pause').textContent=s.run?'暫停時間':'繼續時間';$('speed').textContent='速度 ×'+s.speed;
let p=s.patient;$('sceneName').textContent=p?'處置床｜'+p.name:'護理站';$('roomTag').textContent=p?'床位 ER-'+String(p.id).padStart(2,'0'):'等待派診';$('patientName').textContent=p?p.name+'｜'+p.age+' 歲':'尚未派診';$('patientInfo').textContent=p?'主訴：'+p.complaint+'｜分流：'+p.triage:'系統派診後，病人會自動進入處置區。';$('vitals').innerHTML=p?p.v.map(x=>'<span class="vital">'+x+'</span>').join(''):'';$('focusTitle').textContent=p?(p.stages[p.step]?.title||'交班與去向'):'交班摘要';$('focusText').textContent=p?(p.stages[p.step]?.text||'完成病歷與後續安排。'):'急診持續收治。通報、檢查結果與病人變化會陸續出現。';$('caseBar').style.width=(p?p.step/3*100:0)+'%';$('caseProgress').textContent=p?'處理階段 '+Math.min(p.step+1,3)+'／3':'尚未派診';$('timePressure').textContent=p?'候診 '+p.wait+' 分鐘':'等待派診';
$('actions').innerHTML=p&&p.stages[p.step]?p.stages[p.step].acts.map((a,i)=>'<button class="'+(i===0?'selected':'')+'" data-act="'+i+'">'+a+'</button>').join(''):'<div class="muted">目前沒有需要立即處置的病人。</div>';document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(+b.dataset.act));$('queue').innerHTML=s.queue.map(p=>'<div class="queueItem"><b>'+p.name+' · '+p.triage+'</b><br>'+p.complaint+'｜候診 '+p.wait+' 分</div>').join('')||'<div class="muted">候診區目前無等待病人。</div>';
$('events').innerHTML=s.events.slice(0,4).map(e=>'<div class="task '+(e.kind==='急呼'?'hot':'')+'"><div class="row"><b>'+e.title+'</b><span class="badge '+(e.kind==='急呼'?'red':'')+'">'+e.kind+'</span></div><div class="muted">'+e.body+'</div><div class="controls" style="margin-top:7px">'+e.opts.map((a,i)=>'<button data-event="'+e.id+'" data-i="'+i+'">'+a+'</button>').join('')+'</div></div>').join('')||'<div class="muted">目前沒有待回應事件。</div>';document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>respondEvent(+b.dataset.event,+b.dataset.i));$('handoff').disabled=!p||p.step<3}
function renderLog(){$('feed').innerHTML=s.log.slice(0,16).map(e=>'<div class="entry"><time>'+e.t+'</time>'+e.m+'</div>').join('')}
$('start').onclick=()=>{s.started=true;s.run=true;log('交班完成，開始'+shifts[s.shift]+'。');newPatient();assign();render()};$('pause').onclick=()=>{s.run=!s.run;render()};$('speed').onclick=()=>{s.speed=s.speed===1?4:s.speed===4?10:1;render()};$('handoff').onclick=finish;$('swap').onclick=()=>{s.shift=(s.shift+1)%3;log('換班申請核准，班別調整為'+shifts[s.shift]+'。');render()};$('leave').onclick=()=>{s.leave=!s.leave;if(s.leave){s.patient=null;log('請假生效，未完成病人已交由其他醫師接手。')}else log('已復班。');render()};
function tick(){if(!s.run||!s.started)return;s.min+=s.speed;s.tick++;s.queue.forEach(p=>p.wait+=s.speed);if(s.min>=1440){s.min-=1440;s.day++;if((s.day-1)%7===0){s.week++;s.shift=(s.shift+1)%3;s.leave=false;log('新的一週開始，輪班更新為'+shifts[s.shift]+'。')}}if(s.tick%9===0)newPatient();if(s.tick%6===0&&s.patient)newEvent('護理師','護理師通報',s.patient.name+'仍有不適，請回應目前狀況。',['立即回應','稍後處理']);if(s.tick%13===0&&s.patient)newEvent('檢查','檢查結果回報',s.patient.name+'的檢查結果已回報。',['查看結果','延後查看']);if(s.tick%17===0&&s.patient)newEvent('急呼','急呼',s.patient.name+'狀況有變，護理師請你立即到床邊。',['立即前往','稍後再看']);if(!s.patient)assign();render()}
setInterval(tick,1200);render();
})();</script></body></html>
