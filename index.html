<title>急診倒數：生死一線｜第一班試玩</title>
<style>
:root{--bg:#101820;--panel:#1c2a35;--panel2:#243743;--text:#edf4f7;--muted:#a8bbc5;--accent:#72d4c3;--warn:#ffc46b;--danger:#ff7d7d;--line:#3b515e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Noto Sans TC",sans-serif}button{background:#31505d;color:var(--text);border:1px solid #53717e;border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer;touch-action:manipulation; -webkit-tap-highlight-color:transparent}button:hover{background:#3b6470}button:disabled{opacity:.35;cursor:not-allowed}.wrap{max-width:1180px;margin:auto;padding:16px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-weight:800;font-size:20px}.stats{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 12px;color:var(--muted)}.pill b{color:var(--text)}.layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:14px;margin-top:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}.panel h2,.panel h3{margin:0 0 10px}.room{height:440px;position:relative;overflow:hidden;border-radius:12px;background:#dce5e4;color:#24333a;border:2px solid #6f858b;touch-action:none}.floor{position:absolute;inset:0;background:linear-gradient(90deg,transparent 49%,#bdccca 50%,transparent 51%),linear-gradient(0deg,transparent 49%,#bdccca 50%,transparent 51%);background-size:70px 70px;opacity:.5}.zone{position:absolute;border:2px solid #8da3a5;background:#c9d7d7;border-radius:9px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:700;padding:6px;font-size:13px}.bed{background:#f5f8f6;border:2px solid #78949c;border-radius:10px;position:absolute;width:118px;height:58px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#2c4a54}.bed:before{content:"";position:absolute;left:5px;top:6px;width:27px;height:43px;border-radius:7px;background:#d2e6e8}.bed span{position:relative;margin-left:24px}.player{position:absolute;width:25px;height:25px;border-radius:50%;background:#1e6c78;border:3px solid white;box-shadow:0 2px 6px #42565a;z-index:4;transition:left .08s,top .08s}.player:after{content:"你";position:absolute;top:24px;left:-4px;font-size:11px;color:#123}.npc{position:absolute;width:20px;height:20px;border-radius:50%;background:#c58c48;border:2px solid white;z-index:3}.label{position:absolute;font-size:12px;font-weight:700;color:#34515a}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.dpad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,58px);gap:7px;justify-content:center;margin:12px auto 0;touch-action:manipulation}.dpad button{padding:8px;font-size:24px;min-height:58px;user-select:none;-webkit-user-select:none}.hint{color:var(--muted);font-size:13px;margin-top:8px}.log{height:160px;overflow:auto;background:#121e26;border-radius:9px;padding:10px;color:#c7d7dd;font-size:14px}.log p{margin:0 0 8px}.casehead{display:flex;justify-content:space-between;gap:8px;align-items:start}.tag{border-radius:6px;padding:3px 7px;font-size:12px;background:#36505b}.tag.red{background:#633e43}.bar{height:8px;background:#344853;border-radius:99px;overflow:hidden;margin:8px 0}.bar span{display:block;height:100%;background:var(--accent);width:100%;transition:width .3s}.bar.red span{background:var(--danger)}.muted{color:var(--muted)}.task{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0}.task.done{opacity:.6}.options{display:grid;gap:8px}.options button{text-align:left}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#071017cc;display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.modalbox{max-width:620px;width:100%;max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.modalbox h2{margin-top:0}.field{background:#121e26;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}.draft{white-space:pre-wrap;color:#d8e8ed}.footer{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#e8f4f2;color:#16323a;padding:10px 15px;border-radius:10px;box-shadow:0 4px 18px #0008;z-index:20;max-width:90vw}.status{font-size:14px;color:var(--muted)}@media(max-width:800px){.layout{grid-template-columns:1fr}.room{height:min(52vh,420px);min-height:300px}.log{height:110px}.wrap{padding:10px}.panel{padding:12px}.brand{font-size:18px}.stats{gap:5px}.pill{padding:6px 9px;font-size:14px}.controls button{flex:1;min-height:46px}.dpad{grid-template-columns:repeat(3,minmax(58px,72px));grid-template-rows:repeat(2,60px)}.dpad button{min-height:60px}.modal{align-items:flex-end;padding:8px}.modalbox{max-height:85dvh;padding:16px;border-radius:16px 16px 10px 10px}.options button{min-height:48px}.footer button{min-height:46px}} @media(max-width:390px){.room{min-height:270px;height:42vh}.dpad{grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,56px)}.dpad button{min-height:56px}} 
</style></head>
<body><div class="wrap">
<header class="top"><div><div class="brand">急診倒數：生死一線</div><div class="muted">第一班｜新進 R1 試玩版</div></div><div class="stats"><div class="pill">時間 <b id="clock">08:00</b></div><div class="pill">班次 <b id="shift">準備中</b></div><div class="pill">待辦 <b id="todo">0</b></div></div></header>
<div class="layout"><section class="panel"><h2>急診現場</h2><div class="room" id="room" aria-label="可走動的急診室"><div class="floor"></div>
<div class="zone" style="left:3%;top:4%;width:26%;height:18%">護理站<br>交代／查詢</div><div class="zone" style="right:3%;top:4%;width:25%;height:18%">檢查區</div><div class="zone" style="left:4%;bottom:5%;width:22%;height:17%">入口</div><div class="zone" style="right:4%;bottom:5%;width:24%;height:17%">醫師工作站</div>
<div class="bed" style="left:32%;top:28%"><span>床位 A</span></div><div class="bed" style="left:59%;top:28%"><span>床位 B</span></div><div class="bed" style="left:32%;top:59%"><span>床位 C</span></div><div class="bed" style="left:59%;top:59%"><span>床位 D</span></div>
<div class="npc" id="nurse" style="left:19%;top:30%" title="護理師"></div><div class="label" style="left:14%;top:34%">護理師小林</div><div class="player" id="player" style="left:47%;top:47%"></div>
<div class="label" style="left:40%;top:23%">病人床 A</div><div class="label" style="left:67%;top:23%">病人床 B</div><div class="label" style="left:40%;top:54%">病人床 C</div><div class="label" style="left:67%;top:54%">病人床 D</div>
</div><div class="controls"><button id="interact">互動／查看附近</button><button id="pause">暫停時間</button><button id="help">操作說明</button></div><div class="dpad" aria-label="移動控制"><span></span><button data-move="up">↑</button><span></span><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button></div><div class="hint">手機：點方向鍵移動；靠近床位或護理站後，點「互動／查看附近」。電腦：WASD／方向鍵移動，按 E 互動。</section>
<section class="panel"><div class="casehead"><div><h2>病人與工作</h2><div id="caseStatus" class="status">準備開始第一班</div></div><span id="acuity" class="tag">尚未接診</span></div><div id="caseArea"><p class="muted">按「開始值班」，病人會依急診流量自動到院並分派。你不能挑選或跳過病人。</p><button id="start">開始值班</button></div><h3 style="margin-top:14px">團隊回報</h3><div class="log" id="log"><p>08:00｜你抵達急診室。護理師小林正在護理站整理交班資料。</p></div></section></div>
</div>
<div class="modal hidden" id="modal"><div class="modalbox"><div id="modalContent"></div><div class="footer" id="modalFooter"></div></div></div><div class="toast hidden" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id);let mins=8*60,started=false,paused=false,player={x:50,y:49},patient=null,caseIndex=0,timer=null,toastTimer=null,notes=[],tasks=[],pendingArrival=false,ended=false;
const patients=[{name:'陳先生',age:54,chief:'胸口悶、覺得喘',onset:'大約半小時前',detail:'走到停車場時開始，坐下後仍覺得不舒服',other:'有點冒冷汗，沒有昏倒',vital:'呼吸偏快，臉色有些蒼白',risk:2,need:'先確認目前狀況、安排初步評估並密切追蹤',hint:'胸悶合併喘與冒冷汗，需要優先評估。這是遊戲中的虛構案例。'}, {name:'林小姐',age:29,chief:'腹部不舒服',onset:'今天早上開始',detail:'一開始是隱隱作痛，現在比較明顯',other:'有噁心，沒有提到胸悶或呼吸困難',vital:'清醒，能完整回答問題',risk:1,need:'完成問診、安排評估，觀察症狀變化',hint:'目前描述較穩定，但仍需確認症狀與變化。這是遊戲中的虛構案例。'}];
function log(s){let p=document.createElement('p');p.textContent=$('clock').textContent+'｜'+s;$('log').prepend(p)}function say(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2400)}function clock(){let h=Math.floor(mins/60),m=mins%60;$('clock').textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function update(){clock();$('shift').textContent=started?(ended?'已交班':'值班中'):'準備中';$('todo').textContent=tasks.filter(t=>!t.done).length;renderCase();}
function renderCase(){if(!patient){$('caseArea').innerHTML=ended?'<p>第一班結束。你完成了本次試玩流程。</p><button id="restart">重新體驗</button>':'<p class="muted">等待病人到院。你可以在急診室走動，熟悉床位與護理站。</p><button id="start">開始值班</button>';if(ended)$('restart').onclick=()=>location.reload();$('acuity').textContent=ended?'班次完成':'尚未接診';$('caseStatus').textContent=ended?'已完成交班':'等待分派';return;}
$('acuity').textContent=patient.risk===2?'優先評估':'一般急診';$('acuity').className='tag '+(patient.risk===2?'red':'');$('caseStatus').textContent=patient.name+'｜床位 '+patient.bed+'｜'+patient.phase;
let html=`<div class="task"><b>${patient.name}，${patient.age} 歲</b><div class="muted">主要不舒服：${patient.chief}</div><div class="bar ${patient.worse?'red':''}"><span style="width:${patient.worse?35:patient.risk===2?70:90}%"></span></div><div class="muted">目前狀況：${patient.worse?'症狀加重，需重新評估':patient.vital}</div></div>`;
html+=`<div class="task"><b>本次接診進度</b><div>${patient.assessed?'✓ 已完成初步問診':'○ 初步問診尚未完成'}　${patient.charted?'✓ 病歷草稿已確認':'○ 病歷待確認'}　${patient.order?'✓ 已安排團隊工作':'○ 尚未安排下一步'}</div>${patient.report?'<div>✓ 已收到護理師回報</div>':''}</div>`;
if(!patient.assessed)html+='<button id="ask">開始白話問診</button> ';else if(!patient.charted)html+='<button id="chart">整理病歷草稿</button> ';else if(!patient.order)html+='<button id="plan">決定下一步</button> ';else if(!patient.report)html+='<button disabled>等待護理師回報…</button> ';else if(!patient.recheck)html+='<button id="recheck">回到床邊重新評估</button> ';else html+='<button id="finish">完成本次處理</button> ';
html+='<button id="callSenior">詢問上級醫師</button>';if(patient.report)html+=`<div class="task"><b>護理師回報</b><div>${patient.reportText}</div></div>`;$('caseArea').innerHTML=html;
['ask','chart','plan','recheck','finish','callSenior'].forEach(id=>{let el=$(id);if(el)el.onclick=({ask:openAsk,chart:openChart,plan:openPlan,recheck:recheck,finish:finishCase,callSenior:senior}[id]);});}
function modal(title,body,buttons){$('modalContent').innerHTML=`<h2>${title}</h2>${body}`;$('modalFooter').innerHTML='';buttons.forEach(b=>{let x=document.createElement('button');x.textContent=b.label;x.onclick=()=>{closeModal();b.action()};$('modalFooter').append(x)});$('modal').classList.remove('hidden')}function closeModal(){$('modal').classList.add('hidden')}
function openAsk(){modal('床邊問診｜用一般人的方式了解病人',`<p>你不需要醫學術語。選擇想先問的問題，回答會自動整理成病歷資料。</p><div class="options"><button data-q="onset">「大概什麼時候開始不舒服？」</button><button data-q="detail">「當時正在做什麼？現在有沒有變化？」</button><button data-q="other">「除了這個，還有哪裡不舒服？」</button><button data-q="done">我已經問完，整理目前資訊</button></div><p class="muted">已收集：${notes.length?notes.join('；'):'尚無'}</p>`,[{label:'先關閉',action:()=>{}}]);document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let q=b.dataset.q;if(q==='done'){patient.assessed=true;patient.phase='初步問診完成';log('你完成初步問診，準備整理病歷。');closeModal();update();return;}let key=q==='onset'?'onset':q==='detail'?'detail':'other';if(!notes.includes(patient[key]))notes.push(patient[key]);log('你詢問病人：'+patient[key]+'。');b.disabled=true;b.textContent='已記錄：'+patient[key];});}
function openChart(){let draft=`主訴：${patient.chief}\n發作時間：${notes.includes(patient.onset)?patient.onset:'尚未確認'}\n症狀經過：${notes.includes(patient.detail)?patient.detail:'尚未確認'}\n伴隨症狀：${notes.includes(patient.other)?patient.other:'尚未確認'}\n初步觀察：${patient.vital}`;modal('病歷草稿｜確認你剛剛收集的資訊',`<p>系統依照你的問診整理成草稿。你可以確認，也可以回去補問；不需要自己從空白開始寫。</p><div class="field draft">${draft}</div><p class="muted">「尚未確認」可以保留，不必猜答案。</p>`,[{label:'回去補問',action:openAsk},{label:'確認草稿',action:()=>{patient.charted=true;patient.phase='病歷已確認';log('你確認病歷草稿；未確認的資訊保留為未確認。');update();}}]);}
function openPlan(){modal('安排下一步｜由你決定並與護理師合作',`<p>依照目前收集的資訊，選擇一個下一步。這是遊戲化的虛構流程，不是臨床操作教學。</p><div class="options"><button data-plan="優先請護理師協助觀察目前狀況，並安排初步評估。">請護理師協助觀察並安排初步評估</button><button data-plan="先向上級醫師簡要報告，再一起確認下一步。">先向上級醫師報告、共同確認</button><button data-plan="先回到床邊確認症狀是否有變化。">先回床邊再確認一次</button></div>`,[{label:'取消',action:()=>{}}]);document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{let choice=b.dataset.plan;patient.order=true;patient.phase='已交代團隊工作';log('你交代團隊：'+choice);closeModal();$('caseArea').querySelector('#plan')?.remove();tasks.push({text:'護理師執行並回報：'+patient.name,done:false});update();setTimeout(()=>{if(!patient||!patient.order||patient.report)return;patient.report=true;patient.reportText=patient.worse?'護理師回報：病人表示不舒服加重，請你立即回床邊重新評估。':'護理師回報：已完成你交代的觀察與初步評估，病人目前能清楚回應。';patient.phase='收到護理師回報';tasks[tasks.length-1].done=true;log(patient.reportText);update();},6500);});}
function senior(){modal('上級醫師｜簡短帶教',`<p>「你不用一次就知道所有答案。先把病人現在的主訴、症狀開始時間、目前觀察到的狀況說清楚。遇到不確定的地方就明確說還沒確認，接著再一起決定下一步。」</p><p class="muted">帶教提示：${patient?patient.hint:'先熟悉急診動線，病人到院後會自動分派。'}</p>`,[{label:'知道了',action:()=>{log('你向上級醫師詢問，獲得帶教提示。');}}]);}
function recheck(){patient.recheck=true;patient.phase='重新評估完成';if(patient.risk===2&&!patient.worse){patient.worse=true;patient.vital='病人表示胸悶與喘感加重，需立即再次通知團隊';log('你回到床邊時，發現病人症狀有變化。');}else{log('你回到床邊重新確認病人狀況。');}update();}
function finishCase(){log('你完成本次病人處理，準備交班。');patient=null;notes=[];caseIndex++;if(caseIndex>=patients.length){ended=true;started=false;mins+=8;update();modal('第一班完成','<p>你完成了第一班的兩位病人流程。試玩重點是走動、問診、整理資訊、團隊溝通與追蹤回報；不是醫療知識測驗。</p><p>之後可以再加入更多病人事件、交班內容與更完整的場景互動。</p>',[{label:'結束試玩',action:()=>{}}]);return;}mins+=4;update();setTimeout(arrive,3500);}
function arrive(){if(ended)return;patient={...patients[caseIndex],bed:['A','B','C','D'][caseIndex%4],phase:'新病人到院',assessed:false,charted:false,order:false,report:false,recheck:false,worse:false};notes=[];player.x=47;player.y=47;renderPlayer();log('新病人到院並自動分派至床位 '+patient.bed+'。護理師通知你前往評估。');update();say('新病人已分派，請走到床位 '+patient.bed+'。');}
function finishStart(){started=true;mins=8*60+2;clock();log('護理師小林：「第一位病人已經分派給你，請到床邊開始評估。」');arrive();timer=setInterval(()=>{if(started&&!paused&&!ended){mins++;clock();if(patient&&patient.risk===2&&!patient.recheck&&mins%5===0){patient.worse=true;patient.vital='病人症狀逐漸加重，請盡快回床邊評估';}update();}},7000);}
function move(dx,dy){if(!started||paused)return;player.x=Math.max(3,Math.min(94,player.x+dx));player.y=Math.max(4,Math.min(88,player.y+dy));renderPlayer();}
function renderPlayer(){$('player').style.left=player.x+'%';$('player').style.top=player.y+'%';}
function nearest(){if(!started){say('先開始值班。');return;}if(player.y<27&&player.x<32){modal('護理站',`<p>小林護理師正在工作。</p><p>${patient?'「目前分派給你的是 '+patient.name+'，在床位 '+patient.bed+'。病人不會由你挑選。」':'「目前沒有新病人，先熟悉環境。」'}</p>`,[{label:'詢問上級醫師',action:senior},{label:'離開護理站',action:()=>{}}]);return;}if(patient){let coords={A:[38,34],B:[65,34],C:[38,65],D:[65,65]}[patient.bed];if(Math.abs(player.x-coords[0])+Math.abs(player.y-coords[1])<22){if(!patient.assessed)openAsk();else if(!patient.recheck&&patient.report)recheck();else say('你在床邊查看病人。請使用右側工作面板繼續。');return;}}say('附近沒有可互動的工作物件。走到病床或護理站附近再按 E。');}
$('caseArea').addEventListener('click',e=>{if(e.target&&e.target.id==='start')finishStart();});$('interact').onclick=nearest;$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'繼續時間':'暫停時間';say(paused?'時間已暫停':'時間繼續');};$('help').onclick=()=>modal('操作說明','<ul><li>方向鍵／WASD 或畫面方向鍵：走動</li><li>E 或「互動／查看附近」：和床位、護理站互動</li><li>右側工作面板：進行問診、確認病歷、安排下一步</li><li>時間會推進；護理師工作需要時間，病人狀況也可能變化</li><li>可隨時向上級醫師求助。遊戲不要求你具備醫學背景。</li></ul>',[{label:'開始體驗',action:()=>{}}]);
document.querySelectorAll('[data-move]').forEach(b=>{let d=b.dataset.move;const map={up:[0,-3],down:[0,3],left:[-3,0],right:[3,0]};b.addEventListener('click',()=>move(...map[d]));});window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){e.preventDefault();let map={ArrowUp:[0,-2.5],w:[0,-2.5],W:[0,-2.5],ArrowDown:[0,2.5],s:[0,2.5],S:[0,2.5],ArrowLeft:[-2.5,0],a:[-2.5,0],A:[-2.5,0],ArrowRight:[2.5,0],d:[2.5,0],D:[2.5,0]};move(...map[e.key]);}if(e.key==='e'||e.key==='E')nearest();if(e.key==='Escape')closeModal();});update();
})();
</script></body></html>
