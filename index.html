<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>急診值班｜24 小時模擬</title>
<style>
:root{color-scheme:dark;--bg:#101a22;--panel:#1a2a35;--panel2:#243946;--line:#405764;--text:#edf5f7;--muted:#a8bbc4;--mint:#a5e4d4;--red:#f09b9b;--amber:#f0cd88}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Noto Sans TC",sans-serif}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 13px}button:hover{border-color:var(--mint)}button:focus-visible{outline:3px solid var(--mint)}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:14px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.brand{font-weight:850;font-size:clamp(23px,4vw,32px)}.sub,.muted{color:var(--muted);font-size:13px}.chip{border:1px solid var(--line);border-radius:99px;padding:6px 10px;font-size:13px}.top{margin-bottom:14px}.layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(270px,.7fr);gap:13px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:15px;min-width:0}.panel h2{font-size:18px;margin:0 0 10px}.panel h3{font-size:15px;margin:14px 0 8px}.scene{min-height:390px;display:flex;flex-direction:column;gap:12px}.callout{border:1px solid #76633e;background:#302b22;color:#f4dda9;border-radius:11px;padding:12px}.case{border:1px solid var(--line);background:#13222b;border-radius:12px;padding:13px}.case h3{margin:0 0 4px;font-size:19px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.stat{background:#1b303b;border-radius:9px;padding:9px}.stat small{display:block;color:var(--muted)}.stat b{font-size:17px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choices button{text-align:left;min-height:50px}.choices button.primary{background:var(--mint);color:#15332f;border-color:var(--mint);font-weight:750}.feed{display:grid;gap:7px;max-height:280px;overflow:auto}.entry{border-left:3px solid #638c94;background:#13232d;padding:9px 10px;border-radius:0 8px 8px 0;font-size:13px}.entry time{display:block;color:var(--muted);font-size:11px}.queueItem{padding:9px 10px;background:#13232d;border:1px solid var(--line);border-radius:9px;margin:7px 0;font-size:13px}.badge{font-size:11px;border-radius:99px;padding:3px 7px;background:#4b3c27;color:#ffe1a6}.badge.red{background:#512c32;color:#ffc4c4}.notice{background:#13232d;border-radius:10px;padding:11px;min-height:45px}.bottom{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bottom button{flex:1}.primary{background:var(--mint);color:#15332f;font-weight:750}.hidden{display:none}.bar{height:7px;background:#344953;border-radius:8px;overflow:hidden;margin:7px 0}.bar span{display:block;height:100%;background:var(--mint);width:0}.shiftbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}.shiftbox button{width:100%}.small{font-size:12px;color:var(--muted)}@media(max-width:760px){.layout{grid-template-columns:1fr}.scene{min-height:0}.wrap{padding:9px}.panel{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="wrap">
<header class="top"><div><div class="sub">24 小時急診｜連續值班模擬</div><div class="brand">急診值班</div></div><div class="row"><span class="chip" id="clock">週一 08:00</span><span class="chip" id="shift">早班｜當班中</span><button id="pause">暫停時間</button><button id="speed">速度 ×1</button></div></header>
<div class="layout"><section class="panel scene">
<div class="row"><h2>值班現場</h2><span class="chip" id="status">等待交班</span></div>
<div class="callout" id="handoff">交班摘要：急診持續收治中。確認交班後開始值班。</div>
<div id="caseArea" class="case"><h3>交班中</h3><div class="muted">按下「開始值班」，系統會依分流狀況自動派診。你不能自行挑選病人。</div></div>
<div><div class="row"><h3 id="phaseTitle">目前事件</h3><span class="small" id="progress"></span></div><div id="eventText" class="notice">等待值班開始。</div></div>
<div class="choices" id="choices"></div>
<div class="notice" id="feedback" aria-live="polite">你的操作會推進時間並更新病人狀況。</div>
<div class="bottom"><button class="primary" id="start">開始值班</button><button id="next" disabled>結束處理／接下一位</button></div>
</section><aside class="panel">
<h2>急診動態</h2><div class="stats"><div class="stat"><small>候診</small><b id="waiting">0</b></div><div class="stat"><small>留院</small><b id="inCare">0</b></div><div class="stat"><small>本班處理</small><b id="seen">0</b></div></div>
<h3>護理師通報／事件紀錄</h3><div class="feed" id="feed"></div>
<h3>候診分流（系統派診）</h3><div class="small">排序依分流優先級；此處僅供查看，不能點選病人。</div><div id="queue"></div>
<h3>輪班表</h3><div class="shiftbox"><button id="swap">申請換班</button><button id="leave">申請請假</button></div><p class="small" id="roster">本週早班。下週輪替晚班，之後夜班。非當班時急診由其他醫師接手。</p><div class="bar"><span id="weekbar"></span></div><div class="small" id="weeklabel">本週班次進度</div>
</aside></div><p class="small">遊戲情境與病歷皆為虛構。這是可操作的玩法切片，並非醫療訓練或臨床指引。</p></main>
<script>
(()=>{const $=id=>document.getElementById(id);const dayNames=['週一','週二','週三','週四','週五','週六','週日'];const shiftNames=['早班','晚班','夜班'];let s={day:1,week:1,min:480,paused:true,speed:1,started:false,shift:0,leave:false,patient:null,queue:[],serial:0,seen:0,feed:[],event:null,phase:0,phaseDone:false,swapNext:false};const scenarios=[
{complaint:'胸悶、呼吸急促',age:58,triage:'緊急',v:['心率 116','血壓 146/92','血氧 92%'],events:['護理師通報：病人表示胸口不適加劇。','檢查回報：心電圖已完成，等待醫師判讀。','護理師通報：病人看起來更喘，請立即重新評估。'],steps:[['立即床邊評估','先安排一般候診'],['查看心電圖結果','先讓病人回候診區'],['重新評估生命徵象','完成紀錄並交班']]},
{complaint:'發燒、咳嗽',age:67,triage:'優先',v:['心率 108','血壓 132/84','血氧 94%'],events:['護理師通報：病人畏寒，體溫升高。','檢查回報：胸部影像結果已回報。','護理師通報：病人持續咳嗽，想知道檢查結果。'],steps:[['評估呼吸與生命徵象','直接安排離院'],['查看影像與檢驗結果','忽略檢查回報'],['重新評估並交代後續','結束處理']]},
{complaint:'腹痛、噁心',age:34,triage:'一般',v:['心率 94','血壓 128/82','血氧 98%'],events:['護理師通報：病人腹痛持續，詢問是否需要檢查。','檢查回報：抽血結果已回報。','護理師通報：病人表示疼痛稍有變化。'],steps:[['詢問病史並檢查腹部','直接安排離院'],['查看檢驗結果','忽略檢查回報'],['重新評估並安排後續','結束處理']]},
{complaint:'手腕受傷、腫痛',age:22,triage:'一般',v:['心率 88','血壓 122/76','血氧 99%'],events:['護理師通報：病人手腕腫痛，活動受限。','檢查回報：影像檢查已完成。','護理師通報：病人詢問是否能回家。'],steps:[['評估受傷機轉與肢體','直接安排離院'],['查看影像結果','忽略影像結果'],['重新評估並說明後續','結束處理']]}];
function stamp(){return dayNames[(s.day-1)%7]+' '+String(Math.floor(s.min/60)).padStart(2,'0')+':'+String(s.min%60).padStart(2,'0')}
function addLog(msg){s.feed.unshift({t:stamp(),m:msg});s.feed=s.feed.slice(0,24);renderFeed()}
function makePatient(){s.serial++;let c=scenarios[(s.serial-1)%scenarios.length];s.queue.push({...c,id:s.serial,name:['林小姐','陳先生','王先生','張先生'][(s.serial-1)%4],step:0,wait:0,done:false,quality:0});s.queue.sort((a,b)=>({緊急:0,優先:1,一般:2}[a.triage]-({緊急:0,優先:1,一般:2}[b.triage])));addLog('新病人到院：'+s.queue[s.queue.length-1].name+'，已完成系統分流。');dispatch()}
function dispatch(){if(!s.started||s.patient||s.leave)return;let p=s.queue.shift();if(!p)return;s.patient=p;s.event=p.events[p.step]||'請重新評估病人並完成本次處理。';s.phaseDone=false;addLog('系統自動派診：'+p.name+'（'+p.triage+'）。');}
function choose(i){let p=s.patient;if(!p)return;let good=i===0;if(good){p.quality++;}else{p.quality--;p.wait+=25;}let action=p.steps[p.step][i];addLog('你選擇：'+action+'。');s.min+=good?8:18;p.step++;s.phaseDone=true;s.event=p.events[Math.min(p.step,p.events.length-1)];$('feedback').textContent=good?'處置已記錄。時間向前推進，新的通報或檢查結果可能到達。':'處置未能解決目前問題，病人仍需處理；時間已推進。';if(p.step>=3){$('next').disabled=false;$('next').textContent='完成本次處理／接下一位';}else{$('next').disabled=false;$('next').textContent='查看下一則通報';}render()}
function next(){if(!s.patient)return;if(s.patient.step>=3){let p=s.patient;addLog('本次處理結束：'+p.name+'，已安排後續照護並交班。');s.seen++;s.patient=null;$('next').disabled=true;$('next').textContent='結束處理／接下一位';$('feedback').textContent='已完成交班，系統會自動派送下一位病人。';dispatch();}else{if(s.patient.step===1)addLog('檢查結果已回報，請查看病人事件。');else addLog('收到新的護理師通報。');s.phaseDone=false;s.event=s.patient.events[s.patient.step];$('next').disabled=true;$('feedback').textContent='請依通報內容選擇下一步處置。'}render()}
function render(){ $('clock').textContent='第 '+s.week+' 週｜'+stamp();let duty=s.started&&!s.leave&&((Math.floor(s.min/60)%24)>=8&&(Math.floor(s.min/60)%24)<16);$('shift').textContent=shiftNames[s.shift]+'｜'+(s.leave?'請假中':duty?'當班中':'非當班');$('status').textContent=!s.started?'交班中':s.leave?'已請假':duty?'值班進行中':'非當班';$('waiting').textContent=s.queue.length;$('inCare').textContent=s.patient?1:0;$('seen').textContent=s.seen;$('roster').textContent='本週'+shiftNames[s.shift]+'。下週輪替'+shiftNames[(s.shift+1)%3]+'，之後夜班。非當班時急診由其他醫師接手。';$('weekbar').style.width=((s.day-1)%7+1)/7*100+'%';$('weeklabel').textContent='第 '+s.week+' 週｜本週第 '+((s.day-1)%7+1)+' 天';$('start').disabled=s.started;$('start').textContent=s.started?'已開始值班':'開始值班';$('handoff').textContent=s.started?'交班已完成。急診持續收治，系統依分流優先級自動派診。':'交班摘要：目前急診持續收治中。開始值班後，你會接到系統派診與護理師通報。';
let p=s.patient;if(p){$('caseArea').innerHTML='<div class="row"><h3>'+p.name+'｜'+p.age+' 歲</h3><span class="badge '+(p.triage==='緊急'?'red':'')+'">'+p.triage+'</span></div><div>主訴：'+p.complaint+'</div><div class="stats">'+p.v.map(v=>'<div class="stat"><small>生命徵象</small><b>'+v+'</b></div>').join('')+'</div><p class="muted">到院等待：'+p.wait+' 分鐘｜已完成 '+p.step+'/3 個處理階段</p>';$('phaseTitle').textContent='護理師通報／工作事件';$('progress').textContent='事件 '+Math.min(p.step+1,3)+'／3';$('eventText').textContent=s.event;$('choices').innerHTML=p.steps[p.step]?p.steps[p.step].map((a,i)=>'<button class="'+(i===0?'primary':'')+'" data-choice="'+i+'">'+a+'</button>').join(''):'處理完成，請交班。';document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>choose(+b.dataset.choice));}else{$('caseArea').innerHTML='<h3>'+(s.started?'等待系統派診':'交班中')+'</h3><div class="muted">'+(s.started?'目前沒有待處理的派診病人。急診仍持續運作。':'按下「開始值班」進入當班。')+'</div>';$('phaseTitle').textContent='目前事件';$('progress').textContent='';$('eventText').textContent=s.started?'等待下一位病人或護理師通報。':'等待值班開始。';$('choices').innerHTML='';$('next').disabled=true;}}
function renderFeed(){$('feed').innerHTML=s.feed.map(e=>'<div class="entry"><time>'+e.t+'</time>'+e.m+'</div>').join('')}
$('start').onclick=()=>{s.started=true;s.paused=false;addLog('交班完成，開始'+shiftNames[s.shift]+'。');makePatient();makePatient();render()};$('next').onclick=next;$('pause').onclick=()=>{s.paused=!s.paused;$('pause').textContent=s.paused?'繼續時間':'暫停時間'};$('speed').onclick=()=>{s.speed=s.speed===1?5:s.speed===5?15:1;$('speed').textContent='速度 ×'+s.speed};
$('swap').onclick=()=>{s.swapNext=!s.swapNext;if(s.swapNext){s.shift=(s.shift+1)%3;addLog('換班申請已核准：下一班調整為'+shiftNames[s.shift]+'。')}else addLog('已取消換班申請。');render()};$('leave').onclick=()=>{if(!s.leave){s.leave=true;s.patient=null;addLog('請假申請已核准；未完成病例交由其他當班醫師接手。');$('feedback').textContent='你已離開值班，急診仍由其他醫師持續運作。'}else{s.leave=false;addLog('請假取消。');}render()};
function tick(){if(s.paused||!s.started)return;s.min+=s.speed;let total=s.min;if(total>=1440){s.day++;s.min-=1440;if((s.day-1)%7===0){s.week++;s.shift=(s.shift+1)%3;s.leave=false;addLog('新的一週開始，輪班更新為'+shiftNames[s.shift]+'。');}}if(s.min%180<s.speed){makePatient()}if(s.patient){s.patient.wait+=s.speed;if(s.patient.wait>40&&s.patient.step<2&&Math.random()<.15){s.patient.v[0]='心率 '+(Number(s.patient.v[0].match(/\d+/)?.[0]||90)+4);s.event='護理師通報：病人等待時間增加，請重新評估。';addLog('病人等待期間出現變化，護理師已通報。')}}if(!s.patient)dispatch();render()}
setInterval(tick,1000);render();
})();</script></body></html>
