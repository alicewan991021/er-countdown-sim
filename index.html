function box(w,h,d,mat,x,y,z,parent=scene){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}

function makePerson(isDoctor,x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);let shirt=isDoctor?mats.scrub:mats.coat;box(.55,.78,.32,shirt,0,1.25,0,g);sphere(.22,mats.skin,0,1.83,0,g);sphere(.23,mats.hair,0,2,0,g).scale.set(1,.55,1);limb(new THREE.Vector3(-.32,1.5,0),new THREE.Vector3(-.43,.9,.05),.09,shirt,g);limb(new THREE.Vector3(.32,1.5,0),new THREE.Vector3(.43,.9,.05),.09,shirt,g);limb(new THREE.Vector3(-.16,.88,0),new THREE.Vector3(-.17,.12,0),.12,mats.dark,g);limb(new THREE.Vector3(.16,.88,0),new THREE.Vector3(.17,.12,0),.12,mats.dark,g);sphere(.1,mats.skin,-.43,.86,.05,g);sphere(.1,mats.skin,.43,.86,.05,g);g.userData={isDoctor};return g}
function makePatient(){let g=new THREE.Group();g.position.set(0,0,0);scene.add(g);box(.52,.18,1.25,mats.patient,0,.85,-.02,g);sphere(.25,mats.skin,0,.92,-.85,g);sphere(.26,mats.hair,0,1.08,-.89,g).scale.set(1,.5,1);limb(new THREE.Vector3(-.22,.88,-.45),new THREE.Vector3(-.45,.78,.22),.09,mats.patient,g);limb(new THREE.Vector3(.22,.88,-.45),new THREE.Vector3(.45,.78,.22),.09,mats.patient,g);limb(new THREE.Vector3(-.17,.82,.5),new THREE.Vector3(-.18,.78,1.12),.13,mats.patient,g);limb(new THREE.Vector3(.17,.82,.5),new THREE.Vector3(.18,.78,1.12),.13,mats.patient,g);g.userData.bodyParts=[];let chest=sphere(.2,mats.patient,0,1.04,-.02,g);chest.scale.set(1.2,.35,1.25);chest.userData.part='胸口';let wrist=sphere(.11,mats.skin,.45,.78,.22,g);wrist.userData.part='手腕';let forehead=sphere(.12,mats.skin,0,1.03,-1.02,g);forehead.userData.part='額頭';

let chestHit=hit(.48,0,1.03,-.02,'胸口'),wristHit=hit(.25,.45,.78,.22,'手腕'),headHit=hit(.34,0,1.02,-.92,'額頭');
g.userData.bodyParts=[chest,wrist,forehead,chestHit,wristHit,headHit];return g}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0xc7d8d9);scene.fog=new THREE.Fog(0xc7d8d9,16,32);camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(7,9,11);renderer=new THREE.WebGLRenderer({canvas:$('scene'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;scene.add(new THREE.HemisphereLight(0xffffff,0x72858b,2));let light=new THREE.DirectionalLight(0xffffff,2.2);light.position.set(-5,10,5);light.castShadow=true;scene.add(light);
floor=box(18,.2,18,mats.floor,0,-.12,0);box(18,3,.25,mats.wall,0,1.4,-9);box(.25,3,18,mats.wall,-9,1.4,0);box(18,3,.25,mats.wall,0,1.4,9);box(.25,3,18,mats.wall,9,1.4,0);
for(let i=-7;i<=7;i+=2)box(.025,.01,18,new THREE.MeshStandardMaterial({color:0xb5c7c4}),i,.005,0);
box(1.8,.85,.8,mats.blue,-6,.42,-5);box(1.6,.08,.6,mats.metal,-6,.9,-5);box(.65,.45,.65,mats.dark,-6,1.2,-5);
bed=makeBed(1.8,0);patientGroup=makePatient();patientGroup.position.set(1.8,0,0);nurse=makePerson(false,-5, -4.6);player=makePerson(true,-3,3);
for(let x of [-4.8,-1.4,2,5.4]){box(1.9,.35,3.2,mats.metal,x,.55,-1.5);box(1.75,.08,2.9,mats.sheet,x,.76,-1.5);box(1.6,.12,2.7,mats.coat,x,.84,-1.5);box(.16,.45,.16,mats.metal,x-.7,.25,-2.7);box(.16,.45,.16,mats.metal,x+.7,.25,-2.7);}
let board=box(2.5,1.5,.08,mats.blue,0,2.1,-8.8);for(let i=0;i<4;i++)box(.45,.08,.05,mats.coat,-.7+i*.45,2.3,-8.7);
createPatientLabels();window.addEventListener('resize',resize);$('scene').addEventListener('pointerdown',pointerDown);$('scene').addEventListener('pointerup',pointerUp);$('scene').addEventListener('pointercancel',pointerUp);$('scene').addEventListener('pointermove',pointerMove);document.querySelectorAll('[data-move]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();let a=b.dataset.move.split(',').map(Number);move.x=a[0];move.z=a[1]});b.addEventListener('pointerup',()=>{move.x=move.z=0});b.addEventListener('pointerleave',()=>{move.x=move.z=0})});window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='Escape')closeModal()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);$('start').onclick=startGame;animate()}
function makeBed(x,z){let g=new THREE.Group();g.position.set(x,0,z);scene.add(g);box(1.8,.25,3.2,mats.metal,0,.52,0,g);box(1.72,.12,3.05,mats.sheet,0,.72,0,g);box(1.2,.12,.65,mats.coat,0,.82,-1.05,g);for(let xx of [-.7,.7])for(let zz of [-1.3,1.3])box(.1,.55,.1,mats.metal,xx,.2,zz,g);box(1.85,.75,.1,mats.metal,0,1.02,-1.62,g);return g}
function createPatientLabels(){let g=new THREE.Group();g.position.set(1.8,0,0);scene.add(g);let monitor=box(.55,.6,.1,mats.dark,.9,1.5,-.5,g);box(.42,.04,.03,mats.green,.9,1.63,-.43,g);box(.04,.3,.03,mats.green,.78,1.49,-.43,g);g.userData.monitor=true}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}

function log(s){logs.unshift('08:'+String(Math.floor(elapsed)%60).padStart(2,'0')+'｜'+s);$('log').innerHTML=logs.slice(0,5).map(s=>'<div>'+s+'</div>').join('')}
function startGame(){if(started)return;started=true;stage=1;patientState='arriving';$('start').remove();$('phase').textContent='病人到院｜請前往床邊';$('prompt').textContent='病人已分派至 2 號床';$('detail').textContent='走近病床，點病人的身體部位開始檢查。先觀察病人，再與護理師協作。';$('hint').textContent='使用 WASD／方向鍵移動；手機用右下方向鍵。點地面可走到該處。';log('護理師通知：陳先生到院，已分派至 2 號床。');patientState='assessment';vital=92;setTools(['觀察','聽診器','脈搏','血氧夾']);}
function setTools(arr){$('tools').innerHTML='';arr.forEach((t,i)=>{let b=document.createElement('button');b.className='tool'+(i===0?' active':'');b.textContent=t;b.onclick=()=>{activeTool=t;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('active',x===b));if(t==='病歷'){openChart();return;}if(t==='下醫囑'){openOrders();return;}if(t==='請護理師協助'){nurseTask();return;}if(['觀察','聽診器','脈搏','血氧夾','氧氣面罩','急救按壓'].includes(t)){openProcedure(t);return;}$('prompt').textContent='已選擇：'+t;};$('tools').append(b)});activeTool=arr[0]||''}
let holdTimer=null,holdFrame=null,holdStart=0,holdTarget=null;
let procTool='',procDown=null,procMoves=[],procTaps=0,procLastTap=0,procDone=false;
function openProcedure(tool){if(!nearPatient()){say('先走到病床旁再開始操作');return;}procTool=tool;procDone=false;procDown=null;procMoves=[];procTaps=0;const specs={'觀察':['沿著病人臉部與胸口滑動觀察','face'],'聽診器':['按住胸口並緩慢橫向滑過聽診區','chest'],'脈搏':['在手腕區連續輕點三次，感受脈搏','wrist'],'血氧夾':['把血氧夾拖到病人的手指上','finger'],'氧氣面罩':['把氧氣面罩拖到病人的口鼻位置','face'],'急救按壓':['在胸口區以穩定節奏連續按壓五次','chest']};$('procTitle').textContent=tool+'｜床邊操作';$('procHint').textContent=specs[tool][0];$('procFeedback').textContent='開始操作';$('procTool').textContent=tool;$('procTool').style.display=['聽診器','血氧夾','氧氣面罩'].includes(tool)?'block':'none';$('procedure').classList.remove('hidden');$('procClose').onclick=closeProcedure;$('procReset').onclick=()=>openProcedure(procTool);const stage=$('procStage');stage.onpointerdown=procPointerDown;stage.onpointermove=procPointerMove;stage.onpointerup=procPointerUp;stage.onpointercancel=procPointerUp;}
function closeProcedure(){$('procedure').classList.add('hidden');procDown=null;}
function procPointerDown(e){if(procDone)return;e.preventDefault();const zone=e.target.closest('[data-zone]')?.dataset.zone||'';procDown={x:e.clientX,y:e.clientY,zone,at:performance.now()};procMoves=[{x:e.clientX,y:e.clientY,zone}];if(procTool==='脈搏'&&zone==='wrist'){procTaps++;const now=performance.now();if(now-procLastTap<180)procTaps--;procLastTap=now;$('procFeedback').textContent='已感受到 '+procTaps+' / 3 次脈搏';if(procTaps>=3)procComplete('wrist');}else if(procTool==='急救按壓'&&zone==='chest'){procTaps++;$('procFeedback').textContent='胸外按壓 '+procTaps+' / 5 次';if(procTaps>=5)procComplete('chest');}}
function procPointerMove(e){if(!procDown||procDone)return;e.preventDefault();const zone=e.target.closest('[data-zone]')?.dataset.zone||'';procMoves.push({x:e.clientX,y:e.clientY,zone});if(procTool==='聽診器'&&procDown.zone==='chest'&&zone==='chest'&&Math.abs(e.clientX-procDown.x)>70){$('procFeedback').textContent='聽診中……保持在胸口範圍內';}if(procTool==='觀察'&&procMoves.length>12){$('procFeedback').textContent='觀察中……';}}
function procPointerUp(e){if(!procDown||procDone)return;const start=procDown,zone=e.target.closest('[data-zone]')?.dataset.zone||'';const dist=Math.hypot(e.clientX-start.x,e.clientY-start.y);if(procTool==='觀察'&&procMoves.length>10&&(start.zone==='face'||start.zone==='chest'))procComplete(start.zone);else if(procTool==='聽診器'&&start.zone==='chest'&&zone==='chest'&&dist>70)procComplete('chest');else if(['血氧夾','氧氣面罩'].includes(procTool)&&zone===(procTool==='血氧夾'?'finger':'face'))procComplete(zone);else if(procTool==='脈搏'||procTool==='急救按壓'){}else $('procFeedback').textContent='位置或操作不正確，請依提示重試。';procDown=null;}
function procComplete(zone){if(procDone)return;procDone=true;$('procFeedback').textContent='操作完成，正在判讀結果……';setTimeout(()=>{closeProcedure();if(procTool==='觀察')activeTool='觀察';else if(procTool==='聽診器')activeTool='聽診器';else if(procTool==='脈搏')activeTool='脈搏';else if(procTool==='血氧夾')activeTool='血氧夾';else if(procTool==='氧氣面罩')activeTool='氧氣面罩';else if(procTool==='急救按壓')activeTool='急救按壓';doExam(zone==='face'?'額頭':zone==='chest'?'胸口':zone==='wrist'?'手腕':'手指');},550);}
function pointerDown(e){if(!started||paused)return;const r=$('scene').getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;raycaster.setFromCamera(pointer,camera);let hits=raycaster.intersectObjects(scene.children,true);let partHit=hits.find(h=>h.object.userData.part);if(partHit){if(!nearPatient()){say('請先走近病床');return;}if(['病歷','下醫囑','請護理師協助'].includes(activeTool)){doExam(partHit.object.userData.part);return;}beginHold(partHit.object.userData.part);return;}let groundHit=hits.find(h=>h.object===floor);if(groundHit){walkTarget=groundHit.point.clone();return;}let target=hits.find(h=>patientGroup.children.includes(h.object));if(target){if(nearPatient())beginHold(target.object.userData.part||'病人');else say('先點地面走到病床旁。');}}
function beginHold(part){if(procedureBusy)return;if(!activeTool){say('先選擇檢查工具');return;}holdTarget=part;holdStart=performance.now();$('progressTitle').textContent='正在進行：'+activeTool+'｜'+part;$('progressHud').classList.remove('hidden');$('progressFill').style.width='0%';holdFrame=requestAnimationFrame(updateHold);holdTimer=setTimeout(()=>{cancelHold(false);completeHeldAction(part);},1150);}
function updateHold(){if(!holdStart)return;let p=Math.min(100,(performance.now()-holdStart)/1150*100);$('progressFill').style.width=p+'%';holdFrame=requestAnimationFrame(updateHold);}
function cancelHold(show=true){if(holdTimer)clearTimeout(holdTimer);if(holdFrame)cancelAnimationFrame(holdFrame);holdTimer=holdFrame=null;holdStart=0;$('progressHud').classList.add('hidden');$('progressFill').style.width='0%';if(show)say('操作已取消，請按住目標位置完成操作。');}
function pointerUp(){if(holdStart)cancelHold(true);}
function completeHeldAction(part){holdStart=0;$('progressHud').classList.add('hidden');$('progressFill').style.width='0%';doExam(part);}

let walkTarget=null,dragStart=null;function pointerMove(e){if(e.buttons===1&&activeTool==='觸診'&&nearPatient()){const r=$('scene').getBoundingClientRect();pointer.x=(e.clientX-r.left)/r.width*2-1;pointer.y=-(e.clientY-r.top)/r.height*2+1;raycaster.setFromCamera(pointer,camera);let h=raycaster.intersectObjects(patientGroup.userData.bodyParts,true)[0];if(h)doExam(h.object.userData.part||'胸口')}}
function nearPatient(){return player.position.distanceTo(patientGroup.position)<6.2}
function interactPatient(){if(!nearPatient()){say('先走到病床旁');return;}doExam('病人')}
let procedureBusy=false;
function doExam(part){if(!nearPatient()){say('請走近病床，才能接觸病人');return;}if(!activeTool){say('先選擇檢查工具');return;}if(procedureBusy){say('操作尚未完成，請稍候');return;}if(['病歷','下醫囑','請護理師協助'].includes(activeTool)){if(activeTool==='病歷')openChart();else if(activeTool==='下醫囑')openOrders();else nurseTask();return;}procedureBusy=true;setTimeout(()=>{procedureBusy=false;},1000);let target=patientGroup.userData.bodyParts.find(p=>p.userData.part===part)||patientGroup.userData.bodyParts[0];if(target){target.material.emissive=new THREE.Color(0x2b8d82);target.material.emissiveIntensity=.7;target.scale.multiplyScalar(1.12);}player.userData.busy=true;$('prompt').textContent='正在進行：'+activeTool;$('detail').textContent='操作進行中……保持在床邊，等待檢查完成。';say('正在進行'+activeTool+'操作');let msg='';if(activeTool==='觀察'){exam.look=true;msg='你靠近觀察病人：病人清醒但顯得不舒服，呼吸較快。';}else if(activeTool==='聽診器'){exam.chest=true;msg='你將聽診器放在胸前，完成聽診。呼吸音較急促。';}else if(activeTool==='脈搏'){exam.pulse=true;msg='你在手腕處確認脈搏，脈搏偏快。';}else if(activeTool==='血氧夾'){exam.oxygen=true;msg='你把血氧夾放到病人手指，監測數值顯示偏低。';}else if(activeTool==='血壓'){exam.bp=true;msg='你協助完成血壓測量，數值需要結合其他觀察判讀。';}else if(activeTool==='氧氣面罩'){exam.oxygenGiven=true;msg='你協助病人戴上氧氣面罩，病人呼吸稍微平穩。';vital=Math.min(98,vital+3);}else if(activeTool==='急救按壓'){exam.cpr=true;msg='你開始胸外按壓，護理師立刻到床旁協助並準備急救設備。';nurseBusy=true;}else{msg='你完成了'+activeTool+'操作。';}
$('prompt').textContent=part==='病人'?msg:'操作：'+part; $('detail').textContent=msg;log(msg);if(exam.look&&exam.chest&&exam.pulse){$('phase').textContent='初步檢查完成｜整理病歷';$('detail').textContent='已完成觀察、聽診與脈搏檢查。你可以按「病歷」整理已取得的資料。';setTools(['病歷','下醫囑','請護理師協助']);}if(exam.oxygen&&exam.chest){$('phase').textContent='檢查資料已收集';setTools(['病歷','下醫囑','請護理師協助']);}if(exam.chart){setTools(['病歷','下醫囑','請護理師協助']);}if(activeTool==='病歷')openChart();if(activeTool==='下醫囑')openOrders();if(activeTool==='請護理師協助')nurseTask();if(activeTool==='氧氣面罩'||activeTool==='急救按壓')setTools(['觀察','聽診器','脈搏','血氧夾','病歷','下醫囑','請護理師協助']);}
function openChart(){if(!exam.look||!exam.chest){say('先完成觀察與聽診，再整理病歷');return;}showModal('病歷｜由你檢查到的資訊整理', '<p>主訴：胸口悶、喘。已記錄：'+(exam.look?'外觀與呼吸較急':'尚未觀察')+'；'+(exam.chest?'聽診呼吸音較急促':'未聽診')+'；'+(exam.pulse?'脈搏偏快':'脈搏尚未確認')+'；'+(exam.oxygen?'血氧監測偏低':'血氧尚未測量')+'.</p><p>請確認病歷，未取得的資料不會自動補上。</p>',[['確認並存檔',()=>{exam.chart=true;log('你確認並存檔病歷，內容來自已完成的檢查。');$('phase').textContent='病歷已存檔｜安排醫囑';setTools(['病歷','下醫囑','請護理師協助','氧氣面罩']);}]])}
function openOrders(){if(!exam.chart){say('請先完成病歷存檔');return;}showModal('醫囑｜安排團隊下一步','<p>選擇一項需要團隊執行的工作。護理師會走到病床旁實際執行，完成後向你回報。</p>',[['持續監測生命徵象',()=>nurseTask('monitor')],['協助給予氧氣支持',()=>nurseTask('oxygen')],['通知上級醫師到床邊',()=>nurseTask('senior')]])}
function nurseTask(type='monitor'){closeModal();if(nurseBusy){say('護理師正在執行工作');return;}nurseBusy=true;$('phase').textContent='護理師執行醫囑中';log('你向護理師交代工作；護理師回應並前往床邊。');nurse.userData.target=patientGroup.position.clone().add(new THREE.Vector3(-1.2,0,0));nurse.userData.task=type;setTools(['觀察','聽診器','脈搏','血氧夾','病歷']);}
function showModal(title,body,buttons){$('modalBox').innerHTML='<h2>'+title+'</h2>'+body;buttons.forEach(b=>{let x=document.createElement('button');x.textContent=b[0];x.className='primary';x.onclick=b[1];$('modalBox').appendChild(x)});let close=document.createElement('button');close.textContent='返回場景';close.onclick=closeModal;$('modalBox').appendChild(close);$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
function finishShift(){ended=true;paused=true;showModal('本次急診流程完成','<p>你完成了接診、床邊檢查、病歷、醫囑、護理師協作與追蹤。這是第一段可玩流程；後續可加入更多病例與急救情境。</p>',[['重新體驗',()=>location.reload()]])}
function updateHud(){let m=Math.floor(elapsed),h=8+Math.floor(m/60),mm=m%60;$('clock').textContent=String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');$('patientStatus').textContent=started?'床位 2':'尚未到院';$('vitals').textContent=started?('狀況 '+Math.round(vital)+'/100'):'—'}
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);if(started&&!paused&&!ended){elapsed+=dt*1.7;updateHud();}
let fwd=new THREE.Vector3();camera.getWorldDirection(fwd);fwd.y=0;fwd.normalize();let right=new THREE.Vector3().crossVectors(fwd,new THREE.Vector3(0,1,0)).normalize();let mx=move.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=move.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);if(mx||mz){let dir=right.multiplyScalar(mx).add(fwd.multiplyScalar(-mz)).normalize();player.position.addScaledVector(dir,dt*3.2);player.position.x=THREE.MathUtils.clamp(player.position.x,-7.5,7.5);player.position.z=THREE.MathUtils.clamp(player.position.z,-7.5,7.5);player.rotation.y=Math.atan2(dir.x,dir.z);}if(walkTarget){let d=walkTarget.clone().sub(player.position);d.y=0;if(d.length()<.18)walkTarget=null;else{d.normalize();player.position.addScaledVector(d,dt*3);player.rotation.y=Math.atan2(d.x,d.z);}}
if(nurseBusy&&nurse.userData.target){let d=nurse.userData.target.clone().sub(nurse.position);d.y=0;if(d.length()>.3){d.normalize();nurse.position.addScaledVector(d,dt*1.8);nurse.rotation.y=Math.atan2(d.x,d.z);}else{nurse.userData.target=null;setTimeout(()=>{if(!nurseBusy)return;let t=nurse.userData.task;if(t==='oxygen'){exam.oxygenGiven=true;vital=Math.min(98,vital+4);log('護理師回報：已協助氧氣支持，監測狀況略有改善。');}else if(t==='senior'){log('上級醫師到床邊，與你一起確認病人狀況。');}else{exam.monitor=true;log('護理師回報：已完成監測，病人狀況仍需追蹤。');}nurseBusy=false;nurse.userData.target=new THREE.Vector3(-5,0,-4.6);$('phase').textContent='收到護理師回報｜繼續追蹤';setTools(['觀察','聽診器','脈搏','血氧夾','病歷','下醫囑','請護理師協助','氧氣面罩']);},2500);}}
camera.position.lerp(new THREE.Vector3(player.position.x+7,player.position.y+8,player.position.z+9),.045);camera.lookAt(player.position.x,0.6,player.position.z);renderer.render(scene,camera)}

let edStep=0,edDone={};
const edFlow=[
['護理師向醫師報告','陳先生，58歲，胸悶、喘約半小時。檢傷時清醒可對答，生命徵象已量測，已分派至2號床。','聽取報告'],
['醫師床邊評估','先觀察病人意識、呼吸與外觀，再查看監測器；若病人惡化，先處理危急狀況。','觀察病人','查看監測器'],
['問診與重點檢查','確認症狀開始時間、是否持續、伴隨症狀、病史、用藥與過敏史，再完成床邊檢查。','詢問病史','聽診器','確認脈搏'],
['病歷與醫囑','記錄已取得的資訊，安排心電圖。開立醫囑不代表檢查已完成。','存檔病歷','安排心電圖'],
['護理師執行與回報','護理師確認醫囑、執行檢查並回報；你仍需留意病人狀況。','查看進度','接收護理師回報'],
['醫師重新評估','回到床邊確認症狀、生命徵象與檢查結果，再決定後續處置。','床邊複評','查看結果'],
['決定去向','依整體評估決定返家、留觀或住院，並完成交代與紀錄。','返家','急診留觀','住院']
];
function edSet(n){edStep=n;let s=edFlow[n];$('phase').textContent=s[0];$('prompt').textContent=s[0];$('detail').textContent=s[1];$('tools').innerHTML='';s.slice(2).forEach(t=>{let b=document.createElement('button');b.className='tool';b.textContent=t;b.onclick=()=>edAction(t);$('tools').append(b)});}
function startGame(){if(started)return;started=true;stage=1;patientState='assessment';vital=92;log('護理師通知：陳先生到院，已完成檢傷並分派至2號床。');edSet(0);}
function edAction(t){
 const modal=(title,body,button,fn)=>showModal(title,'<p>'+body+'</p>',[[button,fn]]);
 if(t==='聽取報告'){modal('護理師向醫師報告','陳先生，58歲，胸悶、喘約半小時。檢傷時清醒可對答，生命徵象已量測；心電圖尚未完成。','收到，前往床邊',()=>{log('醫師接收護理師報告。');edSet(1)});return;}
 if(t==='觀察病人'||t==='查看監測器'||t==='詢問病史'||t==='聽診器'||t==='確認脈搏'||t==='床邊複評'){let key=t;modal(t,'請在床邊完成此項評估。完成後記錄結果，並依病人反應決定下一步。','完成評估',()=>{edDone[t]=true;log('完成：'+t);if(edStep===1&&edDone['觀察病人']&&edDone['查看監測器'])edSet(2);else if(edStep===2&&edDone['詢問病史']&&edDone['聽診器']&&edDone['確認脈搏'])edSet(3);else if(edStep===5&&edDone['床邊複評']&&edDone['查看結果'])edSet(6);});return;}
 if(t==='存檔病歷'){modal('病歷記錄','將目前已取得的主訴、問診與檢查發現存入病歷。','存檔',()=>{edDone.chart=true;log('醫師完成病歷記錄。');edSet(3);});return;}
 if(t==='安排心電圖'){modal('醫囑：心電圖','你已安排心電圖。護理師需確認並協助執行，稍後再回報結果。','送出醫囑',()=>{edDone.order=true;log('醫師開立心電圖醫囑。');edSet(4);});return;}
 if(t==='查看進度'){say(edDone.nurse?'心電圖已完成':'心電圖等待護理師執行');return;}
 if(t==='接收護理師回報'){modal('護理師回報','醫師，心電圖已完成，結果已送達。病人目前仍有胸悶，請重新評估。','收到，回床邊',()=>{edDone.nurse=true;edSet(5)});return;}
 if(t==='查看結果'){modal('檢查結果','心電圖結果已回報。請與病人症狀、生命徵象及床邊評估一併判斷。','已查看',()=>{edDone.result=true;if(edDone['床邊複評'])edSet(6)});return;}
 if(['返家','急診留觀','住院'].includes(t)){modal('完成急診評估','你選擇'+t+'。完成必要交代與紀錄後，病例結束。','確認去向',()=>{paused=true;log('病例完成：'+t);showModal('病例完成','已完成護理師報告、醫師評估、病歷、醫囑、護理師回報、複評與去向決定。',[['重新體驗',()=>location.reload()]]);});}
}
function setTools(a){if(started&&edFlow){edSet(edStep);return;}$('tools').innerHTML='';a.forEach(t=>{let b=document.createElement('button');b.className='tool';b.textContent=t;b.onclick=()=>edAction(t);$('tools').append(b)});}
function doExam(part){say('請依目前病例步驟選擇評估項目');}
function openChart(){edAction('存檔病歷');}
function openOrders(){edAction('安排心電圖');}
function nurseTask(){edAction('接收護理師回報');}

init();
})();
