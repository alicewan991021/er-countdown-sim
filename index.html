</svg>
<div class="room-sign">急診觀察區 · ER-01</div>
<div class="hotspot bed-zone" data-place="bed" tabindex="0" role="button" aria-label="處置床"><span class="hint">E｜查看病人</span></div>
<div class="hotspot monitor" data-place="monitor" tabindex="0" role="button" aria-label="生命徵象監視器"><span class="hint">E｜查看監視器</span></div>
<div class="hotspot nurse-desk" data-place="desk" tabindex="0" role="button" aria-label="護理站"><span class="hint">E｜護理站工作單</span></div>
<div class="hotspot phone-zone" data-place="phone" tabindex="0" role="button" aria-label="電話"><span class="hint">E｜接電話</span></div>
<div class="hotspot door-zone" data-place="door" tabindex="0" role="button" aria-label="出口"><span class="hint">E｜離開床邊</span></div>
<div class="player" id="player"><span class="player-label">你</span></div><div class="toast" id="toast"></div>
</section>
<aside class="side"><h2 class="side-title" id="sideTitle">當前病人</h2><div id="case"><p class="case-copy">先完成交班，開始值班後會自動派診。</p></div><h2 class="side-title" style="margin-top:12px">護理師／電話紀錄</h2><div class="loglist" id="logs"></div><div style="margin-top:10px;display:flex;gap:6px"><button id="handoff" style="flex:1">交班</button><button id="leave" style="flex:1">請假</button></div></aside></main>
<footer class="bottom"><div class="key-help"><span class="key">WASD</span>/<span class="key">↑↓←→</span>移動　<span class="key">E</span>互動　<span class="key">Esc</span>離開對話　<span class="key">M</span>全景　<span class="key">P</span>暫停</div><div class="key-help" id="hintline">走到病床、電話或護理站附近，按 E 互動</div></footer>
</div>
<div id="overlay"><div class="dialog"><div class="eyebrow" id="dialogTag">WARD CALL</div><h2 id="dialogTitle">護理師來電</h2><p id="dialogText"></p><div class="dialog-actions" id="dialogActions"></div></div></div>
<script>
(()=>{const $=id=>document.getElementById(id);const labels={bed:'處置床',monitor:'監視器',desk:'護理站',phone:'電話',door:'出口'};const days=['週一','週二','週三','週四','週五','週六','週日'];let g={started:false,run:false,paused:false,min:480,day:1,week:1,shift:0,speed:1,player:{x:47,y:58},patient:null,queue:[],events:[],logs:[],step:0,tick:0,done:0,focus:'bed',overlay:false,leave:false};
const cases=[{name:'陳先生',age:58,complaint:'胸悶、呼吸急促',triage:'緊急',v:['HR 116','BP 146/92','SpO₂ 92%'],tasks:['床邊評估','查看檢查回報','確認照護計畫','完成病歷與交班'],notes:['病人主訴胸悶、呼吸急促，護理師等候你到床邊。','心電圖回報已送達，護理師提醒你查看。','護理師通報病人冒冷汗，請重新確認狀況。','整理病歷與後續安排，交由接班團隊。']},{name:'林小姐',age:34,complaint:'腹痛、噁心',triage:'一般',v:['HR 94','BP 128/82','SpO₂ 98%'],tasks:['問診與初評','查看抽血結果','重新評估疼痛','完成病歷與交班'],notes:['病人腹痛、噁心，護理師詢問是否安排檢查。','抽血結果已回報。','病人表示疼痛位置改變。','確認後續安排並完成交班。']},{name:'王先生',age:67,complaint:'發燒、咳嗽',triage:'優先',v:['HR 108','BP 132/84','SpO₂ 94%'],tasks:['評估呼吸狀況','查看檢查回報','更新照護計畫','完成病歷與交班'],notes:['病人畏寒、咳嗽，血氧偏低。','胸部影像與抽血結果已回報。','病人仍感到喘，護理師請你重新評估。','確認後續觀察與去向。']}];
function time(){return days[(g.day-1)%7]+' '+String(Math.floor(g.min/60)%24).padStart(2,'0')+':'+String(g.min%60).padStart(2,'0')}
function log(m){g.logs.unshift({t:time(),m});g.logs=g.logs.slice(0,12);drawLogs()}
function say(m){$('toast').textContent=m;$('toast').classList.add('show');clearTimeout(say.timer);say.timer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
function openDialog(tag,title,text,choices){g.overlay=true;$('dialogTag').textContent=tag;$('dialogTitle').textContent=title;$('dialogText').textContent=text;$('dialogActions').innerHTML='';choices.forEach(([label,fn])=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>{g.overlay=false;$('overlay').classList.remove('show');fn();render()};$('dialogActions').appendChild(b)});$('overlay').classList.add('show')}
function spawn(){let c=cases[(g.done+g.queue.length+g.tick)%cases.length];g.queue.push({...c,id:g.done+g.queue.length+1,step:0,wait:0});g.queue.sort((a,b)=>({緊急:0,優先:1,一般:2}[a.triage]-({緊急:0,優先:1,一般:2}[b.triage])));log('新病人到院：'+c.name+'，已由系統分流。');if(!g.patient)assign();else call('護理師通報',c.name+'已到候診區，請留意分流。')}
function assign(){if(!g.patient&&g.queue.length&&!g.leave){g.patient=g.queue.shift();g.patient.wait=0;g.step=0;log('系統派診：'+g.patient.name+'安排至處置床。');say('系統派診：'+g.patient.name+'已安排至處置床。')}}
function call(title,text){g.events.push({title,text});log(title+'：'+text);openDialog('來電／護理師',title,text,[['我馬上過去',()=>{g.focus='bed';moveTo('bed');say('你已回應通報。');}],['先處理手邊工作',()=>{if(g.patient)g.patient.wait+=12;log('你延後回應通報。')} ]])}
function currentTask(){return g.patient?g.patient.tasks[Math.min(g.step,3)]:'目前沒有當前病人'}
function interact(place){if(!g.started){say('先按「開始值班」完成交班。');return}if(g.overlay)return;g.focus=place;if(place==='bed'){if(!g.patient){say('床邊目前沒有病人。');return}const p=g.patient;const actions=[['完成床邊評估',()=>work('assess')],['查看病人目前狀況',()=>work('recheck')],['稍後再處理',()=>{p.wait+=8;log('你暫時離開床邊。')}]];openDialog('床邊 · ER-01',p.name+'｜'+p.complaint+'。'+p.notes[Math.min(g.step,3)],actions)}
else if(place==='monitor'){openDialog('生命徵象監視器','目前監測：'+(g.patient?g.patient.v.join(' · '):'目前無床邊病人'),[['確認監測',()=>{log('你確認了監視器讀數。');say('監測資料已確認。')}],['返回',()=>{}]])}
else if(place==='desk'){openDialog('護理站 · 工作單',g.patient?'目前待辦：'+currentTask()+'。病歷進度 '+g.step+'/4。':'目前無當前病人。候診 '+g.queue.length+' 人。',g.patient?[['查看檢查回報',()=>work('result')],['更新照護計畫',()=>work('plan')],['整理病歷並交班',()=>work('handoff')]]:[['查看候診清單',()=>say('候診：'+g.queue.map(p=>p.name+'（'+p.triage+'）').join('、'))]])}
else if(place==='phone'){if(g.events.length){let e=g.events[0];openDialog('電話來電',e.title+'：'+e.text,[['立即回應',()=>{g.events.shift();if(g.patient)g.patient.wait=Math.max(0,g.patient.wait-5);log('你接起電話並回應。')}],['稍後回電',()=>{if(g.patient)g.patient.wait+=10;log('你將電話延後回應。')}]]);}else say('電話暫時沒有響。')}
else if(place==='door'){openDialog('離開床邊','要先離開處置床區嗎？未完成的病人工作會保留。',[['離開床邊',()=>{g.focus='door';say('你離開床邊，仍可回到現場。')}],['留在現場',()=>{}]])}}
function work(kind){let p=g.patient;if(!p){say('目前沒有病人。');return}if(kind==='assess'||kind==='recheck'){if(g.step===0){g.step=1;log('完成床邊評估：'+p.name+'。');say('初步評估完成。下一步查看檢查回報。')}else{p.wait=Math.max(0,p.wait-3);log('重新確認'+p.name+'的狀況。');say('已重新確認病人狀況。')}}
if(kind==='result'){if(g.step<1){say('先完成床邊評估。');return}g.step=2;log('查看檢查回報：'+p.name+'。');say('檢查回報已確認。')}
if(kind==='plan'){if(g.step<2){say('先完成評估並查看檢查回報。');return}g.step=3;log('更新照護計畫並通知護理師。');say('照護計畫已更新。')}
if(kind==='handoff'){if(g.step<3){say('尚有工作未完成：'+currentTask());return}log('完成病歷與交班：'+p.name+'由接班團隊接手。');g.patient=null;g.done++;g.step=0;assign();say('交班完成。')}
render()}
function moveTo(place){let coords={bed:[29,52],monitor:[76,52],desk:[70,75],phone:[90,31],door:[7,75]};let c=coords[place];g.player.x=c[0];g.player.y=c[1];$('player').style.left=c[0]+'%';$('player').style.top=c[1]+'%';g.focus=place;render()}
function move(dx,dy){if(!g.started||g.overlay)return;g.player.x=Math.max(3,Math.min(94,g.player.x+dx));g.player.y=Math.max(28,Math.min(84,g.player.y+dy));$('player').style.left=g.player.x+'%';$('player').style.top=g.player.y+'%'}
function nearest(){let coords={bed:[29,52],monitor:[76,52],desk:[70,75],phone:[90,31],door:[7,75]},best=null,dist=999;for(let [k,c] of Object.entries(coords)){let d=Math.hypot(g.player.x-c[0],g.player.y-c[1]);if(d<dist){best=k;dist=d}}return dist<20?best:null}
function render(){ $('clock').textContent='第 '+g.week+' 週｜'+time();$('shift').textContent=['早班','晚班','夜班'][g.shift];$('duty').textContent=!g.started?'交班中':g.leave?'請假中':g.run?'值班中':'時間暫停';$('start').hidden=g.started;$('pause').hidden=!g.started;$('pause').textContent=g.run?'暫停':'繼續';$('speed').textContent='×'+g.speed;$('bedlabel').textContent=g.patient?'處置床 ER-01 · '+g.patient.triage:'處置床 ER-01 · 空床';$('sideTitle').textContent=g.patient?'當前病人':'候診區';$('case').innerHTML=g.patient?'<h3 class="case-title">'+g.patient.name+'｜'+g.patient.age+'歲</h3><p class="case-copy">'+g.patient.complaint+' · 分流 '+g.patient.triage+'</p><div class="case-metrics">'+g.patient.v.map(v=>'<span class="metric">'+v+'</span>').join('')+'</div><p class="case-copy">目前工作：'+currentTask()+'</p><div class="case-copy">流程 '+g.step+'/4 · 等待 '+g.patient.wait+' 分鐘</div>':'<p class="case-copy">目前無當前病人。候診 '+g.queue.length+' 人；系統會依分流自動派診。</p>';$('logs').innerHTML=g.logs.map(x=>'<div class="log"><time>'+x.t+'</time>'+x.m+'</div>').join('')||'<div class="case-copy">尚無紀錄。</div>';let n=nearest();$('hintline').textContent=n?'按 E 互動：'+labels[n]+'　·　你也可以直接點選場景物件':'走到病床、電話或護理站附近，按 E 互動';document.querySelectorAll('[data-place]').forEach(el=>el.style.filter=el.dataset.place===g.focus?'drop-shadow(0 0 5px #e3c985)':'none')}
function drawLogs(){render()}
document.querySelectorAll('[data-place]').forEach(el=>{el.addEventListener('click',()=>{moveTo(el.dataset.place);interact(el.dataset.place)});el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();moveTo(el.dataset.place);interact(el.dataset.place)}})});
$('start').onclick=()=>{g.started=true;g.run=true;log('完成交班，開始值班。');spawn();render()};$('pause').onclick=()=>{g.run=!g.run;render()};$('speed').onclick=()=>{g.speed=g.speed===1?3:g.speed===3?6:1;render()};$('handoff').onclick=()=>openDialog('交班','確認結束當前班次？未完成病人會交由接班團隊接手。',[['完成交班',()=>{g.patient=null;g.run=false;g.started=false;g.done=0;log('班次交接完成。');say('已完成交班。')}],['繼續值班',()=>{}]]);$('leave').onclick=()=>{g.leave=!g.leave;if(g.leave&&g.patient){g.queue.unshift(g.patient);g.patient=null;log('你請假離開，病人由其他醫師接手。')}else log(g.leave?'你暫時離開值班。':'你返回值班現場。');render()};
document.addEventListener('keydown',e=>{if(g.overlay){if(e.key==='Escape'){$('overlay').classList.remove('show');g.overlay=false}return}if(e.key==='Escape'){say('你離開了互動。');return}if(e.key.toLowerCase()==='m'){$('stage').classList.toggle('wide');return}if(e.key.toLowerCase()==='p'){if(g.started){g.run=!g.run;render()}return}let k=e.key.toLowerCase();if(k==='w'||e.key==='ArrowUp')move(0,-3);else if(k==='s'||e.key==='ArrowDown')move(0,3);else if(k==='a'||e.key==='ArrowLeft')move(-3,0);else if(k==='d'||e.key==='ArrowRight')move(3,0);else if(k==='e'){let n=nearest();if(n)interact(n);else say('靠近床邊、監視器、護理站或電話再按 E。')}});
function tick(){if(!g.run||!g.started)return;g.min+=g.speed;g.tick++;if(g.patient)g.patient.wait+=g.speed;if(g.min>=1440){g.min-=1440;g.day++;if((g.day-1)%7===0){g.week++;g.shift=(g.shift+1)%3;log('新的一週，輪班更新為'+['早班','晚班','夜班'][g.shift]+'。')}}if(g.tick%10===0)spawn();if(g.patient&&g.tick%7===0)call('護理師再次來電',g.patient.name+'仍有不適，請你回到床邊確認。');render()}
setInterval(tick,1800);render();
})();
</script></body></html>
